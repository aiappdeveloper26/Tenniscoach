<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">↗</div><div><strong>little rally</strong><small>POCKET COACH</small></div></div><nav class="nav" id="nav" aria-label="Main navigation"></nav><div class="side-note"><b>Made for first-time coaches.</b><br>Pick your drills, tap the picture to watch, then teach with one clear instruction at a time.</div></aside><main class="main"><div class="topline"><span class="appname">🎾 LITTLE RALLY / COACH DESK</span><div class="top-actions"><span class="status" id="storageStatus"><span class="dot"></span> SAVED ON DEVICE</span><button class="smallbtn" data-act="help">? Help</button></div></div><div class="rendered" id="screen"></div><div class="print-sheet" id="printSheet"></div></main></div>

<script>
'use strict';
const STAGES={warm:{name:'Warm-up',icon:'☀️',hint:'Wake up the body. Make it playful.',target:2,weight:16},foot:{name:'Footwork',icon:'👟',hint:'Teach little steps before fast hitting.',target:2,weight:20},skill:{name:'Skills',icon:'🎾',hint:'Show the movement, then add the ball.',target:2,weight:39},game:{name:'Games',icon:'🏆',hint:'Finish with a success-focused challenge.',target:1,weight:18},cool:{name:'Cooldown',icon:'🌿',hint:'Slow down, stretch gently and reflect.',target:1,weight:7}};
const ORDER=Object.keys(STAGES);
const D=[
// Warm-ups
{id:'w1',stage:'warm',title:'Traffic Lights',sub:'Run, slow down and freeze on a colour.',mins:5,gear:'3 colour cones',goal:'Listening, stopping safely and moving in control.',say:'“Green: jog! Yellow: tiny steps! Red: freeze like a statue!”',setup:'Mark a short safe lane, with all children facing the same way.',steps:['Demonstrate the three signals without running.','Call a colour every 3–5 seconds; keep players moving in one direction.','Change the order and praise safe stops, not fastest runners.'],watch:'Bent knees and soft stopping steps; nobody collides.',fix:'Walk rather than jog; spread the children farther apart.',hard:'Add “blue = sideways steps” on a marked lane.',term:'Freeze = stop and hold still without wobbling.'},
{id:'w2',stage:'warm',title:'Follow the Leader',sub:'Copy a partner’s running path and turns.',mins:5,gear:'4 cones',goal:'Awareness, balance and direction changes.',say:'“Stay two big steps behind. Copy every turn!”',setup:'Set four cones to create one oval route; pair children.',steps:['Coach leads one slow lap and points out spacing.','One partner leads with walking, jogging and turns; partner copies.','Swap the leader after 30–40 seconds.'],watch:'Children look ahead and leave a two-step safety gap.',fix:'Make one big wide loop at walking pace.',hard:'Add a sidestep section between two cones.',term:'Leader = the child who chooses the path.'},
{id:'w3',stage:'warm',title:'Colour Cone Dash',sub:'Find the correct cone when you call it.',mins:4,gear:'3 coloured cones',goal:'Fast decisions and controlled movement.',say:'“Ready in the middle. Find BLUE! Touch it, then come back.”',setup:'Put three cones 2–3 m from a central start spot.',steps:['Name each cone colour while children point to it.','Call one colour; one child moves to touch it.','Child returns to the middle; change colours and players.'],watch:'Child changes direction without bumping others.',fix:'Use just two cones and allow walking.',hard:'Call a two-colour sequence in order.',term:'Reaction = moving after you see or hear a signal.'},
{id:'w4',stage:'warm',title:'Toss, Clap, Catch',sub:'Toss a soft ball and catch it again.',mins:5,gear:'1 soft ball / child',goal:'Track a ball with eyes and coordinate hands.',say:'“Eyes up. Tiny toss. Clap once. Catch softly!”',setup:'Each child stands in a separated personal space.',steps:['Show a tiny upward throw to head height.','Let children toss and catch with two hands.','When ready, add one clap before the catch.'],watch:'Eyes follow the ball; hands reach out softly.',fix:'Skip the clap and toss only a little above hands.',hard:'Try two claps or a gentle bounce before catching.',term:'Tracking = watching the ball until it reaches your hands.'},
{id:'w5',stage:'warm',title:'Animal Moves',sub:'Take turns hopping like a frog and stepping like a bear.',mins:5,gear:'2 cones',goal:'Whole-body coordination and gentle warming up.',say:'“Frog: small hop, soft landing. Bear: hands down, slow steps!”',setup:'Create a short 3–4 m lane with space between children.',steps:['Demonstrate two small frog hops and a quiet landing.','On the return, walk with hands and feet on the ground.','Alternate movements; let each child rest between turns.'],watch:'Soft landings; wrists and shoulders stay comfortable.',fix:'Replace bear steps with ordinary walking.',hard:'Add a sideways crab walk for one short trip.',term:'Landing soft = bend knees and make little noise.'},
{id:'w6',stage:'warm',title:'Side-Step Train',sub:'Travel left and right without crossing your feet.',mins:5,gear:'2 cones',goal:'Lateral movement for tennis.',say:'“Small steps sideways. Keep your feet apart!”',setup:'Mark a short 3 m corridor with a start and finish cone.',steps:['Face the net and demonstrate steps to the right.','Everyone side-steps one way, then comes back left.','Slow the rhythm, then gently increase pace.'],watch:'Shoulders mostly face forward; feet do not cross.',fix:'Use a shorter distance and step one beat at a time.',hard:'Hold a ready-position pose at the end of each trip.',term:'Side shuffle = move sideways using small, quick steps.'},
// Footwork
{id:'f1',stage:'foot',title:'Ready + Split Step',sub:'A tiny hop as the coach sends the ball.',mins:6,gear:'2 markers',goal:'React with feet apart and knees soft.',say:'“Ready… little hop… LAND… then move!”',setup:'Children face you from their own marked spots.',steps:['Show ready position: feet apart, knees soft, racket in front.','Say “hit” and do a tiny hop so both feet land apart.','Point left or right just as they land; they take two steps there.'],watch:'Hop stays tiny, both feet land softly before direction change.',fix:'Replace the hop with a small heel lift and wide landing.',hard:'Point only after your hand-feed starts.',term:'Split step = a small preparatory hop so you can move either way.'},
{id:'f2',stage:'foot',title:'Shuffle + Recover',sub:'Step sideways to a cone, then return to centre.',mins:6,gear:'3 cones',goal:'Move efficiently and regain ready position.',say:'“Shuffle right. Touch. Shuffle HOME. Ready!”',setup:'Centre cone plus one cone 2 m to either side.',steps:['Start at the centre in ready position.','Move sideways to one cone without crossing feet.','Move back to centre, stop, then repeat the other way.'],watch:'No feet crossing on short sideways moves; steady head height.',fix:'Bring cones closer and move slowly.',hard:'Use a coach pointing signal to select a side.',term:'Recover = come back to a useful middle position.'},
{id:'f3',stage:'foot',title:'Forward + Turn Home',sub:'Go to the short ball, turn and jog back.',mins:6,gear:'2 cones',goal:'Move forward and return safely.',say:'“Go FORWARD, bend, touch… TURN and jog home!”',setup:'Mark home spot and one cone 2–3 m in front.',steps:['Start at home with knees slightly bent.','Jog forward and touch the front cone.','Turn sideways, look, and jog back to home; no blind backwards sprinting.'],watch:'Child looks where they are going on the way back.',fix:'Use a walking pace and very short distance.',hard:'Hold a racket and show a pretend touch shot at the cone.',term:'Short ball = a ball landing nearer the net.'},
{id:'f4',stage:'foot',title:'Crossover Chase',sub:'Catch a far-away cone with a big first step.',mins:6,gear:'3 cones',goal:'Cover wider distances to a ball.',say:'“Turn your hips… cross your outside foot… RUN!”',setup:'Put wider cones 3–4 m from the middle.',steps:['Start in ready position and point to a wide cone.','Turn toward that side and take one crossing step to accelerate.','Run to the cone, then recover with small controlled steps.'],watch:'A turn comes before the crossing step; no twisting knee.',fix:'Walk through the turn and crossover first.',hard:'Add a pretend forehand at the far cone.',term:'Crossover step = one foot crosses in front to start a longer run.'},
{id:'f5',stage:'foot',title:'Triangle Feet',sub:'Visit left, front and home like a triangle.',mins:6,gear:'3 cones',goal:'Change direction and remember a route.',say:'“Left cone → front cone → HOME. Stop in ready position!”',setup:'Make a triangle of three cones with 2 m between them.',steps:['Walk the triangle together once.','A child travels from home to left, then front, then home.','Swap direction and repeat with small, controlled steps.'],watch:'Eyes look toward the next cone before turning.',fix:'Use a two-cone path only.',hard:'At each cone, show a quick shadow swing.',term:'Footwork pattern = a repeated route that trains movement.'},
{id:'f6',stage:'foot',title:'Point & Go',sub:'React to the coach’s pointing hand.',mins:5,gear:'3 cones',goal:'Quick first step and good balance.',say:'“Watch my HAND. One, two steps, stop!”',setup:'Create left, centre and right spots.',steps:['Stand in front of children and show a left/right point.','Children take two quick steps to that side then freeze.','Return to centre after each try; alternate sides.'],watch:'No false start; children look at the coach and stop balanced.',fix:'Hold the pointing signal for longer.',hard:'Add a gentle split step before the signal.',term:'First step = the first foot movement toward a ball.'},
// Skills
{id:'s1',stage:'skill',title:'Racket Pancake',sub:'Balance a ball on the racket like a pancake.',mins:7,gear:'Racket + soft ball',goal:'Control racket angle and keep eyes on the ball.',say:'“Racket flat like a tray. Walk slowly. Keep the ball asleep!”',setup:'One soft ball and one junior racket for each child.',steps:['Demonstrate an almost flat racket face at waist height.','Put a ball in the middle; hold still for five seconds.','Walk between two markers without dropping the ball.'],watch:'Calm hands and a mostly level racket face.',fix:'Start with a beanbag or foam ball and stand still.',hard:'Add a gentle racket bounce or a curved route.',term:'Racket face = the flat string area that touches the ball.'},
{id:'s2',stage:'skill',title:'Forehand Shadow Swing',sub:'Practise the forward-side swing with no ball.',mins:8,gear:'Racket only',goal:'Learn a relaxed low-to-high forehand movement.',say:'“Turn sideways, swing from LOW to HIGH, finish by your shoulder!”',setup:'Children spread out by at least a racket-length plus safety space.',steps:['Show the ready pose with racket in front.','Turn shoulders to the racket side, then swing smoothly from low to high.','Finish above the opposite shoulder and return to ready.'],watch:'Balanced feet, easy swing, and imaginary contact in front.',fix:'Do the motion without a racket first.',hard:'Add a coach-counted step before swinging.',term:'Forehand = the shot hit on your racket-hand side after a bounce.'},
{id:'s3',stage:'skill',title:'Forehand Drop & Hit',sub:'Let a soft ball bounce once, then hit it forward.',mins:9,gear:'Racket + red/orange balls',goal:'Time a simple forehand contact.',say:'“DROP… BOUNCE… HIT in FRONT… finish high!”',setup:'Use a mini-court and a clear forward target. One hitter per lane.',steps:['Coach demonstrates a gentle hand-drop on the hitting side.','Child drops the ball, lets it bounce once, then swings forward.','Aim across a low net or marked line; retrieve only on your signal.'],watch:'Ball contacted a little in front of body; no huge swing.',fix:'Coach drops the ball closer; move start position nearer the net.',hard:'Coach hand-feeds a gentle side toss.',term:'Contact point = where the racket meets the ball.'},
{id:'s4',stage:'skill',title:'Two-Hand Backhand',sub:'Make a smooth stroke on the opposite side.',mins:8,gear:'Junior racket',goal:'Turn shoulders and move both hands together.',say:'“Two hands together. Turn… swing… finish across!”',setup:'One shadow-swing lane per child, with wide spacing.',steps:['Put both hands on the handle; show the racket on the non-dominant side.','Turn shoulders as one unit and make a slow low-to-high swing.','Finish comfortably toward the opposite shoulder; reset.'],watch:'Two hands remain together and the child stays balanced.',fix:'Practise very slowly without a ball.',hard:'Add a soft self-drop and bounce before hitting.',term:'Backhand = a stroke on the side opposite your forehand.'},
{id:'s5',stage:'skill',title:'Backhand Contact Window',sub:'Meet a softly fed ball out in front on the backhand side.',mins:8,gear:'Racket + soft balls',goal:'Find the right place to meet the ball.',say:'“Turn early. Step. Meet the ball HERE, in front!”',setup:'Coach stands safely to the side and tosses a soft ball to backhand side.',steps:['Child starts ready with two hands on racket.','Coach underhand-tosses a gentle ball to bounce at the backhand-side marker.','Child turns, steps, and meets the ball slightly ahead of the front hip.'],watch:'Contact is out in front, not trapped beside or behind the body.',fix:'Freeze at the contact point with a stationary held ball.',hard:'Vary the gentle feed by one small step to either side.',term:'Contact window = the small area where hitting the ball feels easiest.'},
{id:'s6',stage:'skill',title:'Soft Volley Block',sub:'Stop the ball before it bounces near the net.',mins:8,gear:'Racket + foam balls',goal:'Keep the racket in front and use a short volley.',say:'“Racket UP. Little step. BLOCK—no big swing!”',setup:'Coach underhand-tosses a foam ball from a safe, short distance.',steps:['Show racket head above hand and knees softly bent.','Coach gives a slow chest-height toss while child steps toward it.','Child uses a short firm block back to an open target area.'],watch:'Ball is hit before bounce; no big backswing near other children.',fix:'Catch the ball on the strings or use an extra-soft hand toss.',hard:'Alternate gentle tosses to forehand and backhand sides.',term:'Volley = hit the ball in the air, before it bounces.'},
{id:'s7',stage:'skill',title:'Serve Toss to the Sky',sub:'Learn a calm upward toss before trying a serve.',mins:7,gear:'1 soft ball / child',goal:'Send the ball up in a controlled vertical line.',say:'“Arm long… lift the ball UP… catch it in front!”',setup:'Children each stand behind their own line, well separated.',steps:['Stand side-on and hold a soft ball in the non-racket hand.','Lift the arm smoothly to release the ball just above reach.','Watch its rise, let it fall and catch; no hitting yet.'],watch:'Quiet head, relaxed straight lifting arm, toss not thrown forward.',fix:'Start with release only a few centimetres above the hand.',hard:'Add racket in trophy pose, still without striking.',term:'Toss = lifting and releasing the ball to start a serve.'},
{id:'s8',stage:'skill',title:'Mini-Court Rally',sub:'Send a soft ball back and forth over a low net.',mins:10,gear:'2 rackets + slow ball',goal:'Develop cooperative rallying.',say:'“Bounce once… send it gently… help your partner!”',setup:'Pairs stand close across a mini-net or a safe marked line.',steps:['Begin with one hand-feed, then a gentle racket return.','Partners try one bounce then one hit across the net.','Count their best consecutive returns; aim for three together.'],watch:'Small swings and kind feeds; both partners have space.',fix:'Allow bounce-and-catch before a hand toss back.',hard:'Ask for five cooperative hits in a row.',term:'Rally = a sequence of shots sent back and forth.'},
// Games
{id:'g1',stage:'game',title:'Cone Castle',sub:'Knock down a small cone tower with a soft shot.',mins:8,gear:'Cones + soft balls',goal:'Aim instead of hitting hard.',say:'“Pick a castle. Eyes on target. Gentle hit—can you topple it?”',setup:'Build 2–3 low cone targets, far from waiting players.',steps:['Let each child choose a target cone.','Child self-drops or receives a gentle coach feed and aims softly.','Celebrate near misses as well as hits; reset the tower.'],watch:'Children aim before swinging; waiting players remain behind line.',fix:'Make the target wider or allow underarm rolls.',hard:'Move the castle slightly farther away.',term:'Target = the area you want the ball to reach.'},
{id:'g2',stage:'game',title:'Clean the Court',sub:'Cooperative team game moving balls across a line.',mins:8,gear:'Several soft balls',goal:'Cooperation, accuracy and active movement.',say:'“Send the balls gently to the other side. Stop when I say FREEZE!”',setup:'Two teams stand on separate halves divided by a clear line; no hard throws.',steps:['Place the same number of foam balls on both sides.','For 30–45 seconds, players roll or gently send balls across.','Freeze, count together, and repeat with a teamwork challenge.'],watch:'No throwing at people; everyone respects the centre line.',fix:'All balls are rolled along the ground.',hard:'Use a racket to guide the ball rather than hands.',term:'Cooperative = working together rather than only trying to win.'},
{id:'g3',stage:'game',title:'Rally Ladder',sub:'Build a shared best rally: 2, then 3, then 5.',mins:9,gear:'Mini-net + slow balls',goal:'Encourage steady control and confidence.',say:'“Two together! Can we beat our record with three?”',setup:'Make pairs on small courts with lots of space.',steps:['Partners start with a gentle feed and try two returns in a row.','After success, celebrate and aim for three, then five.','Reset the challenge after a miss with no penalty.'],watch:'Players control speed and help each other succeed.',fix:'Allow catching and tossing for the first two rounds.',hard:'Try five hits with a direction target.',term:'Consecutive = one after another without a miss.'},
{id:'g4',stage:'game',title:'Treasure Island',sub:'Earn a marker by sending a ball into an island.',mins:9,gear:'Hoops/cones + tokens',goal:'Learn simple shot placement in a playful format.',say:'“Hit the island! When you land one, collect one treasure!”',setup:'Make a marked target island; keep treasures away from active hitting lanes.',steps:['Show the island area clearly with cones or a hoop.','Each child takes one gentle hit toward the island.','Award one token for landing inside; collect between rounds only.'],watch:'Children do not run into court while another is swinging.',fix:'Broaden the island or allow ball rolls.',hard:'Offer two islands with different target distances.',term:'Placement = choosing where a ball should land.'},
{id:'g5',stage:'game',title:'Hit & Rotate',sub:'Hit once, then move to the back of the queue.',mins:8,gear:'Mini-net + 3 cones',goal:'Build teamwork and smooth transitions.',say:'“HIT… move around the OUTSIDE… join the back!”',setup:'One marked hitting spot and a separate safe return route.',steps:['Demonstrate a single gentle shot from the front of the queue.','After the shot, player follows cones around the outside to queue end.','Next player steps into hitting spot only after the lane is clear.'],watch:'Players never cross behind an active swinging racket.',fix:'Replace hitting with a catch-and-throw return.',hard:'Try a group target of ten successful shots.',term:'Rotation = changing turns in a clear, safe order.'},
{id:'g6',stage:'game',title:'Target Zones',sub:'Pick one landing zone before the shot.',mins:9,gear:'Flat markers + slow balls',goal:'Combine aiming with gentle control.',say:'“Choose LEFT or RIGHT. Point at it. Now aim!”',setup:'Mark two wide target boxes on the far side of a mini-net.',steps:['Ask a child to say or point to one target zone.','Coach feeds an easy ball; child hits softly toward that box.','Mark success with a team tally; rotate players.'],watch:'Choice happens before hitting; child does not over-swing.',fix:'Targets are closer and wider; allow underarm tossing.',hard:'Add a middle zone and switch targets on a signal.',term:'Zone = a marked section of the playing area.'},
// Cooldowns
{id:'c1',stage:'cool',title:'Walk + Big Breaths',sub:'Slow walk followed by gentle breathing.',mins:3,gear:'None',goal:'Let effort settle and finish calmly.',say:'“Walk slowly. Smell a flower… blow a candle!”',setup:'Gather players in a wide spaced circle.',steps:['Walk around the circle slowly for 30–60 seconds.','Stop, breathe in gently through the nose, then out slowly.','Repeat three easy breaths without holding breath.'],watch:'Shoulders soften and no one feels dizzy.',fix:'Breathe normally if deep breaths feel uncomfortable.',hard:'Let a child lead a relaxed breathing count.',term:'Cooldown = a gradual return to calm movement.'},
{id:'c2',stage:'cool',title:'Calf Stretch',sub:'One foot back, heel gently toward the floor.',mins:3,gear:'Wall/fence optional',goal:'Notice tight lower-leg muscles safely.',say:'“Back foot flat. Tiny lean. Feel a gentle stretch.”',setup:'Use fence support if needed, with enough distance between players.',steps:['Put one foot forward and one a little behind.','Keep back heel down and gently bend the front knee.','Hold comfortably about 10–15 seconds; swap sides.'],watch:'No bouncing or pushing into pain.',fix:'Make the step smaller and use a wall for balance.',hard:'Ask children where they feel the stretch in the back calf.',term:'Calf = the muscle at the back of your lower leg.'},
{id:'c3',stage:'cool',title:'Front-Thigh Stretch',sub:'Gently bend one knee while holding support.',mins:3,gear:'Fence optional',goal:'Gentle quadriceps mobility and balance.',say:'“Hold the fence. Bend your knee. Soft and easy.”',setup:'Children stand beside a fence or in personal spaces.',steps:['Hold a fence for balance and stand tall.','Bend one knee; hold ankle gently if comfortable.','Keep knees close, hold briefly, then switch legs.'],watch:'No pulling hard on the foot and no knee pain.',fix:'Skip the ankle hold; simply bend and release the knee.',hard:'Try balancing for two seconds without support only if steady.',term:'Quadriceps = the muscles on the front of the thigh.'},
{id:'c4',stage:'cool',title:'Shoulder Hug',sub:'A relaxed across-the-body arm stretch.',mins:3,gear:'None',goal:'Calmly release shoulder tension.',say:'“Hug one arm across your chest. No pulling hard.”',setup:'Stand with enough room to open both arms.',steps:['Bring one arm gently across the upper chest.','Use the other hand to support that arm, not the elbow joint.','Hold 10–15 seconds, release, and swap arms.'],watch:'Shoulders stay relaxed; stretching never hurts.',fix:'Use a smaller, comfortable arm movement.',hard:'Follow with two slow shoulder rolls.',term:'Across-the-body stretch = arm gently rests over chest.'},
{id:'c5',stage:'cool',title:'High-Five Reflection',sub:'Celebrate effort and choose one thing to improve.',mins:3,gear:'None',goal:'Build confidence and finish positively.',say:'“One thing you did well? One thing you’ll try next time?”',setup:'Gather in a relaxed circle away from loose balls.',steps:['Invite each child to name one success from today.','Ask what the group would like to try next lesson.','Offer optional high-fives and remind everyone to collect gear.'],watch:'Every child gets a chance; no teasing or forced sharing.',fix:'Invite children to show a thumbs-up instead of speaking.',hard:'Ask children to remember one new tennis term.',term:'Reflection = thinking about what you learned.'}
];
const BYID=Object.fromEntries(D.map(d=>[d.id,d]));
const START=['w1','w4','f1','f2','s2','s3','g1','c1'];
const KEY='little-rally-v1';
let storageOkay=false;
try{const t='__little_rally_probe';localStorage.setItem(t,'ok');storageOkay=localStorage.getItem(t)==='ok';localStorage.removeItem(t)}catch(e){storageOkay=false}
let initial={age:'8-10',level:'new',duration:60,group:6,selected:START,saved:[]};
if(storageOkay){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')initial={...initial,...x}}catch(e){}}
let state={...initial,view:'build',stage:'warm',filter:'all',search:'',coachIdx:0,seconds:null,running:false,finished:false,modalId:null,phase:0.18,speed:1,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,deadline:null};
state.selected=Array.isArray(state.selected)?[...new Set(state.selected.filter(x=>BYID[x]))]:START.slice();
state.saved=Array.isArray(state.saved)?state.saved.filter(x=>x&&Array.isArray(x.selected)&&typeof x.name==='string').slice(0,50):[];
state.duration=[30,45,60,75,90].includes(Number(state.duration))?Number(state.duration):60;
state.age=['5-7','8-10','11-13'].includes(state.age)?state.age:'8-10';
state.level=['new','starter','growing'].includes(state.level)?state.level:'new';
state.group=[2,4,6,8,10,12].includes(Number(state.group))?Number(state.group):6;
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(!storageOkay)return;try{localStorage.setItem(KEY,JSON.stringify({age:state.age,level:state.level,duration:state.duration,group:state.group,selected:state.selected,saved:state.saved}))}catch(e){storageOkay=false;updateStorage();toast('Device storage blocked: export a backup from Saved.')}}
function updateStorage(){const el=$('#storageStatus');if(el)el.innerHTML=storageOkay?'<span class="dot"></span> SAVED ON DEVICE':'<span class="dot" style="background:#ce9850"></span> EXPORT FOR BACKUP'}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2700)}
const ICONS={build:'<path d="M3 5h18M3 12h18M3 19h18"/><path d="M8 3v4M16 10v4M10 17v4"/>',library:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',coach:'<path d="M8 5V3h8v2M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',saved:'<path d="M5 4h14v17l-7-4-7 4z"/>'};
const svgIcon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
function nav(){const labels={build:'Build lesson',library:'Drill library',coach:'Teach now',saved:'Saved plans'};$('#nav').innerHTML=Object.keys(labels).map(k=>`<button data-act="view" data-view="${k}" class="${state.view===k?'active':''}" aria-current="${state.view===k?'page':'false'}">${svgIcon(k)}<span>${labels[k]}</span></button>`).join('')}
function listSelected(){return ORDER.flatMap(s=>D.filter(d=>d.stage===s&&state.selected.includes(d.id)))}
function allocations(){const arr=listSelected();if(!arr.length)return[];const groups=ORDER.filter(s=>arr.some(d=>d.stage===s));const allWeight=groups.reduce((s,k)=>s+STAGES[k].weight,0);const raw=arr.map(d=>{const stageItems=arr.filter(z=>z.stage===d.stage);const groupWeight=STAGES[d.stage].weight/allWeight*state.duration;const totalMin=stageItems.reduce((s,z)=>s+z.mins,0);return groupWeight*d.mins/totalMin});let mins=raw.map(n=>Math.floor(n));let leftover=state.duration-mins.reduce((a,b)=>a+b,0);let indexed=raw.map((n,i)=>({i,f:n-Math.floor(n)})).sort((a,b)=>b.f-a.f);for(let k=0;k<leftover;k++)mins[indexed[k%indexed.length].i]++;return arr.map((d,i)=>({...d,allotted:mins[i]}))}
function dateName(){return 'Class · '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function ballAdvice(){return state.age==='5-7'?'Try red foam/low-compression balls and a small court.':state.age==='8-10'?(state.level==='growing'?'Try orange balls and a scaled court.':'Start with red or orange low-compression balls on a small court.'):'Use orange or green balls depending on ability; start smaller/slower if needed.'}
function timeFormat(s){s=Math.max(0,Math.floor(s||0));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function hero(){return `<section class="hero"><div class="hero-text"><div class="eyebrow">THE LITTLE COACHING PLAYBOOK</div><h1>Pick. Play.<br><span>Coach with joy.</span></h1><p>Build your own kids’ tennis lesson. Every activity has an animated demo and exactly what to say.</p></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 270 220"><rect x="-20" y="18" width="248" height="195" rx="24" fill="#204248" stroke="#56736f" stroke-width="2" transform="rotate(-13 130 100)"/><g transform="rotate(-13 124 108)" stroke="#73918d" fill="none" stroke-width="2"><rect x="37" y="43" width="160" height="142" rx="4"/><path d="M117 43v142M37 114h160M65 43v142M170 43v142"/></g><circle cx="173" cy="72" r="25" fill="#d7f75b"/><path d="M156 49q35 20 32 46M154 90q35-20 39-36" stroke="#7d9f3b" fill="none" stroke-width="2"/><g transform="translate(84 140) rotate(-15)"><ellipse cx="0" cy="-11" rx="31" ry="42" stroke="#fb996e" stroke-width="8" fill="none"/><path d="M0 32v35M-17 8l34-36M-27-2l47-50" stroke="#fb996e" stroke-width="7" stroke-linecap="round"/><path d="M-23-32h46M-25-20h50M-25-8h50" stroke="#fb996e" stroke-width="1.5"/></g></svg></div></section>`}
function profile(){return `<div class="profile"><div class="field"><label for="age">PLAYERS’ AGE</label><select id="age" data-setting="age"><option value="5-7" ${state.age==='5-7'?'selected':''}>5–7 years</option><option value="8-10" ${state.age==='8-10'?'selected':''}>8–10 years</option><option value="11-13" ${state.age==='11-13'?'selected':''}>11–13 years</option></select></div><div class="field"><label for="level">EXPERIENCE</label><select id="level" data-setting="level"><option value="new" ${state.level==='new'?'selected':''}>First-timers</option><option value="starter" ${state.level==='starter'?'selected':''}>Beginners</option><option value="growing" ${state.level==='growing'?'selected':''}>Improving</option></select></div><div class="field"><label for="duration">CLASS LENGTH</label><select id="duration" data-setting="duration">${[30,45,60,75,90].map(n=>`<option value="${n}" ${state.duration===n?'selected':''}>${n} minutes</option>`).join('')}</select></div><div class="field"><label for="group">KIDS IN CLASS</label><select id="group" data-setting="group">${[2,4,6,8,10,12].map(n=>`<option value="${n}" ${state.group===n?'selected':''}>${n} kids</option>`).join('')}</select></div></div><div class="coach-tip"><span class="tip-icon">💡</span><div><strong>Starter tip:</strong> ${ballAdvice()} Age is only a guide — match ball speed and court size to what children can successfully rally with.</div></div>`}
function preview(d){return `<div class="card-visual"><div class="mini-svg" data-preview="${d.id}">${scene(d.id,0.24)}</div><span class="card-topbadge">${STAGES[d.stage].icon} ${STAGES[d.stage].name}</span></div>`}
function card(d){const chosen=state.selected.includes(d.id);return `<article class="drill-card ${chosen?'chosen':''}">${preview(d)}<div class="card-body"><h3>${safe(d.title)}</h3><p class="card-sub">${safe(d.sub)}</p><div class="card-meta"><span class="tag">⏱ ${d.mins}m guide</span><span class="tag">${safe(d.gear)}</span></div><div class="card-actions"><button class="btn secondary" data-act="demo" data-id="${d.id}" aria-label="Watch animated demo for ${safe(d.title)}">▶ Watch demo</button><button class="btn plus ${chosen?'selected':''}" data-act="choose" data-id="${d.id}" aria-pressed="${chosen}">${chosen?'✓ Added':'+ Add'}</button></div></div></article>`}
function stageTabs(){return `<div class="course-tabs" role="tablist" aria-label="Lesson sections">${ORDER.map(s=>`<button role="tab" aria-selected="${state.stage===s}" class="course-tab ${state.stage===s?'active':''}" data-act="stage" data-stage="${s}">${STAGES[s].icon} ${STAGES[s].name}<span class="count">${state.selected.filter(id=>BYID[id]?.stage===s).length}</span></button>`).join('')}</div>`}
function timeline(){let rows=allocations(),start=0;return rows.length?`<div class="timeline">${rows.map((d,i)=>{let at=start;start+=d.allotted;return `<div class="timeline-row"><span class="bubble">${STAGES[d.stage].icon}</span><div class="time-block">${at}–${start}′</div><div class="detail"><b>${safe(d.title)}</b><span>${STAGES[d.stage].name} · ${d.allotted} min</span></div><div class="row-actions"><button class="iconbtn" title="Watch demonstration" aria-label="Watch ${safe(d.title)}" data-act="demo" data-id="${d.id}">▶</button><button class="iconbtn" title="Remove from plan" aria-label="Remove ${safe(d.title)}" data-act="choose" data-id="${d.id}">×</button></div></div>`}).join('')}</div>`:`<div class="empty"><strong>No drills chosen yet</strong>Tap + Add on an activity above.</div>`}
function builder(){const n=state.selected.length,s=STAGES[state.stage];return `${hero()}<section class="section"><div class="section-head"><div><div class="eyebrow">STEP 01</div><h2>Your class setup</h2><p>Change these at any time.</p></div><span class="pill">⏱ ${state.duration}-min class</span></div>${profile()}</section><section class="section"><div class="section-head"><div><div class="eyebrow">STEP 02 · YOUR COURSE MENU</div><h2>Pick your activities</h2><p>Try 2 warm-ups, 2 footwork, 2 skills, 1 game and 1 cooldown.</p></div><button class="smallbtn" data-act="shuffle">↻ Mix for me</button></div>${stageTabs()}<div class="stage-note"><span><strong>${s.name}</strong> · ${s.hint}</span><span>Selected ${state.selected.filter(x=>BYID[x].stage===state.stage).length} / suggested ${s.target}</span></div><div class="drill-grid">${D.filter(d=>d.stage===state.stage).map(card).join('')}</div><div class="builder-actions" style="margin-top:15px"><button class="btn outline" data-act="stagePrev" ${state.stage==='warm'?'disabled':''}>← Previous category</button><button class="btn dark" data-act="stageNext" ${state.stage==='cool'?'disabled':''}>Next category →</button></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">STEP 03</div><h2>Your class at a glance</h2><p>${n} chosen activities. Times automatically fit ${state.duration} minutes.</p></div></div>${timeline()}<div class="builder-footer"><div><h3>Ready to coach?</h3><div class="muted">Tap “Teach now” to see one activity at a time.</div></div><div class="next-row"><button class="btn outline" data-act="save" ${n===0?'disabled':''}>♡ Save plan</button><button class="btn dark" data-act="start" ${n===0?'disabled':''}>▶ Teach now</button></div></div></section>`}
function library(){let q=state.search.trim().toLowerCase();const items=D.filter(d=>(state.filter==='all'||d.stage===state.filter)&&(!q||[d.title,d.sub,d.goal,d.term,d.gear].some(x=>x.toLowerCase().includes(q))));return `<section><div class="eyebrow">BROWSE & LEARN</div><h1>Drill library<span style="color:#80b090">.</span></h1><p class="muted">${D.length} different activities. Open any card to watch its own animated movement, practise the words, and check for common mistakes.</p><input class="searchbar" id="search" placeholder="Search ‘forehand’, ‘balance’, ‘catch’…" value="${safe(state.search)}" aria-label="Search activities"><div class="course-tabs"><button class="course-tab ${state.filter==='all'?'active':''}" data-act="filter" data-stage="all">All ${D.length}</button>${ORDER.map(s=>`<button class="course-tab ${state.filter===s?'active':''}" data-act="filter" data-stage="${s}">${STAGES[s].icon} ${STAGES[s].name}</button>`).join('')}</div><div class="section-head" style="margin-top:13px"><div><h2>${items.length} activity${items.length===1?'':'ies'}</h2><p>Tap Watch demo to learn how to coach it.</p></div></div>${items.length?`<div class="drill-grid">${items.map(card).join('')}</div>`:'<div class="empty">No drills match that search. Try another word.</div>'}</section>`}
function coach(){const a=allocations();if(!a.length)return `<div class="empty"><strong>Make your lesson first</strong>Choose activities from the course menu.<p><button class="btn" data-act="view" data-view="build">Build lesson</button></p></div>`;if(state.finished)return `<div class="coach-end"><div class="big">🏆</div><h1>Great coaching!</h1><p>Your ${state.duration}-minute lesson is complete. Ask the children what they enjoyed most.</p><button class="btn dark" data-act="coachRestart">↻ Run this plan again</button> <button class="btn secondary" data-act="view" data-view="build">Edit the menu</button></div>`;state.coachIdx=Math.min(Math.max(state.coachIdx,0),a.length-1);const d=a[state.coachIdx];if(state.seconds===null)state.seconds=d.allotted*60;return `<section><div class="section-head"><div><div class="eyebrow">ON-COURT MODE</div><h2>One drill at a time</h2><p>Read the yellow line aloud; follow the steps.</p></div><span class="pill">${state.coachIdx+1} of ${a.length}</span></div><div class="coach-layout"><div class="coach-main"><div class="coach-header"><div><div class="eyebrow">${STAGES[d.stage].icon} ${STAGES[d.stage].name} · ${d.allotted} MIN</div><h2 style="margin:4px 0 2px">${safe(d.title)}</h2><small>${safe(d.goal)}</small></div><button class="smallbtn" data-act="demo" data-id="${d.id}">⛶ Full demo</button></div><div class="progress"><div style="width:${100*state.coachIdx/a.length}%"></div></div><div class="coach-visual" id="coachVisual" data-demo="${d.id}">${scene(d.id,state.phase)}<div class="viewlabel">${sideScene(d.id)?'SIDE VIEW':'TOP VIEW'} · LOOPING DEMO</div></div><div class="demo-toolbar"><button class="toolbtn" data-act="animToggle">${state.playing?'⏸ Pause demo':'▶ Play demo'}</button><button class="toolbtn" data-act="speak" data-id="${d.id}">🔊 Hear cue</button><button class="toolbtn ${state.speed===.6?'active':''}" data-act="speed" data-speed="0.6">Slow</button><button class="toolbtn ${state.speed===1?'active':''}" data-act="speed" data-speed="1">Normal</button><button class="toolbtn ${state.speed===1.6?'active':''}" data-act="speed" data-speed="1.6">Fast</button><small>Illustrated motion, not video</small></div><div class="coach-content"><div class="say"><strong>🗣 SAY THIS TO THE KIDS</strong><p>${safe(d.say)}</p></div><div class="eyebrow">BEFORE YOU START</div><p style="font-size:14px">${safe(d.setup)} <strong>Equipment:</strong> ${safe(d.gear)}.</p><h3>Do this, step by step</h3><ol class="steps">${d.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><div class="watch-panel"><b>👀 What to check</b>${safe(d.watch)}</div><div class="fix-panel"><strong>Too difficult?</strong> ${safe(d.fix)}<br><strong>Too easy?</strong> ${safe(d.hard)}</div><div class="gloss" style="margin-top:10px"><strong>Term explained:</strong> ${safe(d.term)}</div></div><div class="coach-controls"><button class="btn outline" data-act="coachPrev" ${state.coachIdx===0?'disabled':''}>← Back</button><button class="btn secondary" data-act="demo" data-id="${d.id}">⛶ Full demo</button><button class="btn dark" data-act="coachNext">${state.coachIdx===a.length-1?'✓ Finish class':'Done · Next →'}</button></div></div><aside class="coach-timer"><div><small style="color:#c4e0d3">ACTIVITY TIMER</small><div class="clock" id="clock">${timeFormat(state.seconds)}</div><p>${d.allotted} min planned</p></div><div class="timer-actions"><button class="btn" data-act="timerToggle" id="timerBtn">${state.running?'⏸ Pause':'▶ Start'}</button><button class="btn secondary" data-act="timerReset">↻</button></div><div class="tiny-list">${a.map((z,i)=>`<button class="${i===state.coachIdx?'active':''}" data-act="coachJump" data-index="${i}"><span>${STAGES[z.stage].icon}</span><span style="text-overflow:ellipsis;overflow:hidden;white-space:nowrap">${safe(z.title)}</span><span>${z.allotted}m</span></button>`).join('')}</div></aside></div><div class="water-alert">💧 Check everyone has water and enough space between swings. Pause whenever needed.</div></section>`}
function saves(){return `<section><div class="eyebrow">YOUR OWN COACHING MENUS</div><h1>Saved plans<span style="color:#80b090">.</span></h1><p class="muted">Save a combination to reuse next week, or remix it whenever you like. Stored on this device/browser only.</p><div class="builder-actions" style="margin:20px 0"><button class="btn dark" data-act="save" ${state.selected.length===0?'disabled':''}>♡ Save current plan</button><button class="btn outline" data-act="export">↓ Export backup</button><button class="btn outline" data-act="import">↑ Import backup</button><button class="btn outline" data-act="print">▤ Print current</button></div><div class="note-box">${storageOkay?'Your selections save automatically in this browser.':'⚠ Browser storage is blocked in this context. Export a JSON backup before closing the app.'} <strong>Important:</strong> iPhone private browsing, clearing website data, or opening a different copy/location of this file may lose local saves. Export a backup for safekeeping.</div><div class="section-head"><div><h2>${state.saved.length} saved lesson${state.saved.length===1?'':'s'}</h2><p>Load any lesson to change its drills and duration.</p></div></div>${state.saved.length?`<div class="save-grid">${state.saved.map((p,i)=>`<article class="save-card"><span class="eyebrow">${safe(p.duration)} MIN · ${safe(p.age)} YRS</span><strong>${safe(p.name)}</strong><p>${p.selected.filter(x=>BYID[x]).length} drills · ${safe(p.level==='new'?'First-timers':p.level==='starter'?'Beginners':'Improving')}</p><div class="buttons"><button class="btn dark" data-act="load" data-index="${i}">Open plan</button><button class="btn outline" data-act="rename" data-index="${i}">Rename</button><button class="btn outline" data-act="delete" data-index="${i}">Delete</button></div></article>`).join('')}</div>`:'<div class="empty"><strong>No saved lessons yet</strong>Build a class, then tap “Save plan” to keep that combination.</div>'}<div class="section" style="margin-top:30px"><h3>Coach’s quick safety check</h3><p class="muted">Clear the hitting area, use suitably sized rackets and slower balls, give everyone room to swing, keep water nearby, and stop any movement that causes pain. Make games encouraging, not elimination-based.</p><p class="top-hint">Coaching ideas are original simplified drills informed by youth tennis principles. This app does not replace safeguarding or first-aid training.</p></div></section>`}
function buildPrint(){const a=allocations();let at=0;$('#printSheet').innerHTML=`<h1>Little Rally · Class Plan</h1><p>${state.duration} minutes · Ages ${safe(state.age)} · ${safe(state.group)} kids · ${safe(state.level)}</p>${a.map(d=>{const start=at;at+=d.allotted;return `<div class="print-row"><b>${start}–${at} min: ${safe(d.title)}</b> (${STAGES[d.stage].name})<br><i>${safe(d.say)}</i><br>Setup: ${safe(d.setup)}<br>${d.steps.map((s,i)=>`${i+1}. ${safe(s)}`).join('<br>')}<br>Check: ${safe(d.watch)}</div>`}).join('')}`}
function render(){nav();$('#screen').innerHTML=state.view==='build'?builder():state.view==='library'?library():state.view==='coach'?coach():saves();updateStorage();buildPrint();}
function changeView(v){state.view=v;state.running=false;state.deadline=null;render();window.scrollTo({top:0,behavior:'auto'})}
function toggle(id){if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else state.selected.push(id);state.finished=false;state.coachIdx=0;state.seconds=null;state.running=false;state.deadline=null;persist();render();toast(state.selected.includes(id)?'Added to your lesson':'Removed from your lesson')}
function shuffle(){let old=state.selected.join(',');for(let i=0;i<5;i++){state.selected=ORDER.flatMap(stage=>{const pool=D.filter(d=>d.stage===stage).sort(()=>Math.random()-.5);return pool.slice(0,STAGES[stage].target).map(x=>x.id)});if(state.selected.join(',')!==old)break;}state.finished=false;state.coachIdx=0;state.seconds=null;state.running=false;state.deadline=null;persist();render();toast('Fresh lesson menu ready!')}
function save(){if(!state.selected.length){toast('Add a drill first');return}state.saved.unshift({name:dateName(),selected:listSelected().map(x=>x.id),age:state.age,level:state.level,group:state.group,duration:state.duration,when:new Date().toISOString()});state.saved=state.saved.slice(0,50);persist();render();toast('Lesson saved on this device')}
function load(i){let p=state.saved[i];if(!p)return;state.selected=p.selected.filter(x=>BYID[x]);state.age=p.age||'8-10';state.level=p.level||'new';state.group=Number(p.group)||6;state.duration=Number(p.duration)||60;state.coachIdx=0;state.seconds=null;state.running=false;state.finished=false;state.view='build';state.stage='warm';persist();render();toast('Loaded: '+p.name);window.scrollTo(0,0)}
function download(name,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportData(){download('little-rally-lessons-backup.json',JSON.stringify({app:'Little Rally',version:1,exported:new Date().toISOString(),settings:{age:state.age,level:state.level,group:state.group,duration:state.duration},selected:state.selected,saved:state.saved},null,2));toast('Backup downloaded')}
function newCoach(){state.view='coach';state.coachIdx=0;state.seconds=null;state.running=false;state.deadline=null;state.finished=false;state.phase=0.16;render();window.scrollTo(0,0)}
function jump(i){const a=allocations();if(i<0||i>=a.length)return;state.coachIdx=i;state.seconds=a[i].allotted*60;state.running=false;state.deadline=null;state.finished=false;state.phase=0.16;render()}
function next(){const a=allocations();state.running=false;state.deadline=null;if(state.coachIdx+1>=a.length){state.finished=true;render();toast('Class finished! Well done.')}else jump(state.coachIdx+1)}
function openDemo(id){if(!BYID[id])return;state.modalId=id;state.phase=0.17;const d=BYID[id],chosen=state.selected.includes(id);$('#modalContent').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${STAGES[d.stage].icon} ${STAGES[d.stage].name} · ${d.mins} MIN GUIDE</div><h2>${safe(d.title)}</h2><div class="muted">${safe(d.goal)}</div></div><button class="close" data-act="close" aria-label="Close demo">×</button></div><div class="modal-visual" id="modalVisual" data-demo="${d.id}">${scene(d.id,state.phase)}<span class="viewlabel">${sideScene(d.id)?'SIDE VIEW':'TOP VIEW'} · UNIQUE ANIMATED DEMO</span></div><div class="demo-toolbar"><button class="toolbtn" data-act="animToggle">${state.playing?'⏸ Pause demo':'▶ Play demo'}</button><button class="toolbtn" data-act="speak" data-id="${d.id}">🔊 Hear cue</button><button class="toolbtn ${state.speed===.6?'active':''}" data-act="speed" data-speed="0.6">Slow</button><button class="toolbtn ${state.speed===1?'active':''}" data-act="speed" data-speed="1">Normal</button><button class="toolbtn ${state.speed===1.6?'active':''}" data-act="speed" data-speed="1.6">Fast</button></div><div class="modal-copy"><div class="say"><strong>🗣 SAY THIS TO THE KIDS</strong><p>${safe(d.say)}</p></div><div class="eyebrow">SET IT UP</div><p style="font-size:14px">${safe(d.setup)} <strong>Need:</strong> ${safe(d.gear)}.</p><h3>Do these 3 steps</h3><ol class="steps">${d.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><div class="checkpoint"><strong>👀 Movement check</strong>${safe(d.watch)}</div><div class="fix-panel"><strong>If they struggle:</strong> ${safe(d.fix)}<br><strong>If easy:</strong> ${safe(d.hard)}</div><div class="gloss" style="margin-top:10px"><strong>Tennis term:</strong> ${safe(d.term)}</div><p class="top-hint">The simplified animated diagram shows the drill direction or movement. Keep children spaced safely and supervise each attempt.</p></div><div class="modal-bottom"><button class="btn outline" data-act="close">Close</button><button class="btn ${chosen?'selected':'dark'}" data-act="modalChoose" data-id="${d.id}">${chosen?'✓ Added · Remove':'＋ Add to my class'}</button></div>`;const dialog=$('#drillDialog');if(!dialog.open)dialog.showModal()}
function closeDemo(){if($('#drillDialog').open)$('#drillDialog').close();state.modalId=null}

const C={court:'#d8eddb',dark:'#143843',net:'#537b76',lime:'#d7f75b',orange:'#f98f65',blue:'#4b7ec8',cone:'#ee8661',ball:'#e7dc40'};
const ease=t=>t*t*(3-2*t),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;
const bounce=t=>1-Math.pow(Math.abs(Math.sin(Math.PI*t)),.7);
function pointPath(points,t){t=((t%1)+1)%1;const ar=[...points,points[0]],seg=t*(ar.length-1),i=Math.min(Math.floor(seg),ar.length-2),u=ease(seg-i);return [mix(ar[i][0],ar[i+1][0],u),mix(ar[i][1],ar[i+1][1],u)]}
function circle(x,y,r,fill,stroke='none',sw=0){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}
function textSvg(x,y,txt,color='#335d61',size=11,weight=850){return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" text-anchor="middle" fill="${color}" font-family="system-ui,sans-serif">${safe(txt)}</text>`}
function p(x,y,col=C.dark,scale=1,angle=0){return `<g transform="translate(${x} ${y}) rotate(${angle}) scale(${scale})"><ellipse cx="0" cy="8" rx="11" ry="6" fill="#7cac8d33"/><path d="M-5 9l-5 10M5 9l5 10" stroke="#304c58" stroke-width="4" stroke-linecap="round"/><path d="M-9 3h18" stroke="#304c58" stroke-width="3" stroke-linecap="round"/><rect x="-8" y="-5" width="16" height="18" rx="7" fill="${col}"/><circle cy="-12" r="7" fill="#f4b48e"/><path d="M8 0l17-11" stroke="#304c58" stroke-width="3" stroke-linecap="round"/><ellipse cx="28" cy="-15" rx="7" ry="11" transform="rotate(-31 28 -15)" stroke="#e68457" stroke-width="3" fill="none"/></g>`}
function cone(x,y,col=C.cone){return `<g transform="translate(${x} ${y})"><ellipse cy="7" rx="10" ry="4" fill="#b3c9a7"/><path d="M0-11L-8 7H8z" fill="${col}" stroke="#d86c4f" stroke-width="1"/><path d="M-5 2H5" stroke="white" stroke-width="2"/></g>`}
function target(x,y,r=20){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff4b3" stroke="#e5b755" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r*.63}" fill="#f5b77f"/><circle cx="${x}" cy="${y}" r="${r*.28}" fill="#f06d56"/>`}
function arrowPath(d,col='#227c75'){return `<path d="${d}" stroke="${col}" stroke-width="2.7" stroke-linecap="round" stroke-dasharray="5 6" fill="none"/>`}
function court(){return `<rect width="360" height="210" fill="#dceddd"/><rect x="33" y="17" width="294" height="176" rx="5" fill="#b9dcbd" stroke="#fff" stroke-width="3"/><path d="M180 17v176M33 105h294M92 17v176M268 17v176" stroke="#fff" stroke-width="2.3"/><path d="M25 105h310" stroke="#6f9c85" stroke-width="1.6"/>`}
function sideBg(){return `<rect width="360" height="210" fill="#e9f3e6"/><path d="M0 174h360" stroke="#87ae91" stroke-width="3"/><rect x="15" y="184" width="330" height="7" rx="4" fill="#d0e4cb"/><circle cx="308" cy="38" r="46" fill="#e0f0d0"/>`}
function svgWrap(body,label,side=false){return `<svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated illustration of ${safe(label)}">${side?sideBg():court()}${body}</svg>`}
function moving(id,t,points,extra='',c=C.dark,tag='MOVE'){let [x,y]=pointPath(points,t);return svgWrap(extra+arrowPath('M'+points.map(q=>q.join(' ')).join(' L'))+p(x,y,c,1.05)+textSvg(180,199,tag),BYID[id].title)}
function personSide(x,y,{arm=-35,arm2=0,ball=null,legs=0,sc=1}={}){let a=arm*Math.PI/180;let hand=[x+Math.cos(a)*45,y-63+Math.sin(a)*45];let ra=arm2*Math.PI/180;let other=[x-15+Math.cos(ra)*37,y-62+Math.sin(ra)*37];return `<g transform="translate(${x} ${y}) scale(${sc}) translate(${-x} ${-y})"><ellipse cx="${x}" cy="${y+4}" rx="22" ry="5" fill="#7098813a"/><path d="M${x-7} ${y-43}L${x-11-legs} ${y} M${x+7} ${y-43}L${x+15+legs} ${y}" stroke="#284450" stroke-width="7" stroke-linecap="round"/><path d="M${x} ${y-90}L${x} ${y-40}" stroke="#2e887c" stroke-width="16" stroke-linecap="round"/><circle cx="${x}" cy="${y-105}" r="13" fill="#efb28b"/><path d="M${x+6} ${y-75}L${hand.join(' ')}" stroke="#efb28b" stroke-width="8" stroke-linecap="round"/><path d="M${x-5} ${y-76}L${other.join(' ')}" stroke="#efb28b" stroke-width="7" stroke-linecap="round"/><path d="M${hand[0]} ${hand[1]}l14 -5" stroke="#5a4942" stroke-width="5" stroke-linecap="round"/><ellipse cx="${hand[0]+24}" cy="${hand[1]-8}" rx="11" ry="21" transform="rotate(27 ${hand[0]+24} ${hand[1]-8})" stroke="#dc805d" stroke-width="4" fill="none"/><path d="M${hand[0]+16} ${hand[1]-13}l17 8M${hand[0]+15} ${hand[1]-2}l17-8" stroke="#dc805d" stroke-width="1"/></g>`}
function strokeScene(id,t,which){const u=(Math.sin(t*2*Math.PI-Math.PI/2)+1)/2;let arm=which==='fore'?mix(143,-28,ease(u)):which==='back'?mix(215,28,ease(u)):mix(-36,-15,ease(u));const ballx=which==='back'?mix(106,178,u):mix(278,224,u);return svgWrap(`${textSvg(182,35,which==='fore'?'FOREHAND · low → high':which==='back'?'BACKHAND · two hands':'VOLLEY · tiny block',C.dark,13)}${personSide(172,177,{arm,arm2:which==='back'?43:125})}${circle(ballx,93-22*Math.sin(Math.PI*u),8,C.ball,'#96a636',2)}${arrowPath(which==='back'?'M117 120 Q155 56 241 47':'M260 135 Q250 58 170 42',C.orange)}${textSvg(182,199,'Slow swing, stay balanced')}`,BYID[id].title,true)}
function sideScene(id){return ['w4','w5','f1','s1','s2','s4','s6','s7','c1','c2','c3','c4','c5'].includes(id)}
function scene(id,t){t=((t%1)+1)%1;const f=(n)=>Number(n.toFixed(1));let extra='',x,y,q,b,phase=t;

// Event delegation and small-device animations.
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;switch(a){
case 'view':changeView(b.dataset.view);break;
case 'stage':state.stage=b.dataset.stage;render();break;
case 'stageNext':state.stage=ORDER[Math.min(4,ORDER.indexOf(state.stage)+1)];render();break;
case 'stagePrev':state.stage=ORDER[Math.max(0,ORDER.indexOf(state.stage)-1)];render();break;
case 'filter':state.filter=b.dataset.stage;render();break;
case 'choose':toggle(id);break;
case 'modalChoose':closeDemo();toggle(id);break;
case 'demo':openDemo(id);break;
case 'close':closeDemo();break;
case 'shuffle':shuffle();break;
case 'save':save();break;
case 'start':newCoach();break;
case 'coachPrev':jump(state.coachIdx-1);break;
case 'coachNext':next();break;
case 'coachJump':jump(+b.dataset.index);break;
case 'coachRestart':newCoach();break;
case 'timerToggle':state.running=!state.running;state.deadline=state.running?Date.now()+state.seconds*1000:null;const el=$('#timerBtn');if(el)el.textContent=state.running?'⏸ Pause':'▶ Start';break;
case 'timerReset':state.running=false;state.deadline=null;state.seconds=allocations()[state.coachIdx]?.allotted*60||0;if($('#clock'))$('#clock').textContent=timeFormat(state.seconds);if($('#timerBtn'))$('#timerBtn').textContent='▶ Start';break;
case 'animToggle':state.playing=!state.playing;document.querySelectorAll('[data-act="animToggle"]').forEach(el=>el.textContent=state.playing?'⏸ Pause demo':'▶ Play demo');break;
case 'speed':state.speed=+b.dataset.speed;document.querySelectorAll('[data-act="speed"]').forEach(el=>el.classList.toggle('active',+el.dataset.speed===state.speed));break;
case 'speak':{const d=BYID[id];if(!d||!('speechSynthesis' in window)){toast('Voice reading is not available in this browser');break;}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.say.replace(/[“”]/g,''));u.lang='en-US';u.rate=.86;window.speechSynthesis.speak(u);}catch(e){toast('Voice could not start on this device')}break;}
case 'load':load(+b.dataset.index);break;
case 'rename':{const i=+b.dataset.index;const p=state.saved[i];if(!p)break;const name=prompt('Name this lesson:',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,100);persist();render();toast('Lesson renamed')}break;}
case 'delete':{const i=+b.dataset.index;const p=state.saved[i];if(p&&confirm(`Delete saved lesson “${p.name}”?`)){state.saved.splice(i,1);persist();render();toast('Saved lesson deleted')}break}
case 'export':exportData();break;
case 'import':$('#importFile').click();break;
case 'print':window.print();break;
case 'help':toast('1. Set class details  2. Add drills  3. Watch demos  4. Tap Teach now');break;
}});
document.addEventListener('change',e=>{const k=e.target.dataset.setting;if(k){state[k]=['duration','group'].includes(k)?Number(e.target.value):e.target.value;state.seconds=null;state.running=false;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;state.search=e.target.value;const content=$('#screen');const active=document.activeElement;state.view='library';render();const input=$('#search');input.focus();input.setSelectionRange(start,start)}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Backup file is too large');const data=JSON.parse(await file.text());if(data.app!=='Little Rally'||data.version!==1||!Array.isArray(data.saved)||!Array.isArray(data.selected))throw Error('Not a Little Rally backup');let clean=data.saved.filter(p=>p&&typeof p.name==='string'&&Array.isArray(p.selected)).slice(0,50).map(p=>({...p,name:p.name.slice(0,100),selected:p.selected.filter(id=>BYID[id]),duration:[30,45,60,75,90].includes(Number(p.duration))?Number(p.duration):60}));state.saved=clean;state.selected=data.selected.filter(id=>BYID[id]);state.age=['5-7','8-10','11-13'].includes(data.settings?.age)?data.settings.age:'8-10';state.level=['new','starter','growing'].includes(data.settings?.level)?data.settings.level:'new';state.group=[2,4,6,8,10,12].includes(Number(data.settings?.group))?Number(data.settings.group):6;state.duration=[30,45,60,75,90].includes(Number(data.settings?.duration))?Number(data.settings.duration):60;state.seconds=null;state.coachIdx=0;state.running=false;persist();render();toast(`Imported ${clean.length} saved plan(s)`)}catch(err){toast('Import failed: '+err.message)}finally{e.target.value=''}});
$('#drillDialog').addEventListener('close',()=>{state.modalId=null});
$('#drillDialog').addEventListener('click',e=>{if(e.target===$('#drillDialog'))closeDemo()});
setInterval(()=>{if(!state.running||state.view!=='coach'||state.finished)return;if(state.seconds!==null&&state.seconds>0){state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if($('#clock'))$('#clock').textContent=timeFormat(state.seconds);if(state.seconds===0){state.running=false;state.deadline=null;toast('Time! Tap Done · Next when ready.');const btn=$('#timerBtn');if(btn)btn.textContent='▶ Start'}}},250);
let last=0,lastDraw=0;function animate(now){requestAnimationFrame(animate);if(now-lastDraw<42)return;const delta=last?now-last:42;last=now;lastDraw=now;if(state.playing)state.phase=(state.phase+Math.min(delta,100)*state.speed/4250)%1;let modal=$('#modalVisual'),cv=$('#coachVisual');if(modal&&$('#drillDialog').open&&state.modalId){const caption=modal.querySelector('.viewlabel')?.outerHTML||'';modal.innerHTML=scene(state.modalId,state.phase)+caption}else if(cv&&state.view==='coach'&&!state.finished){const d=allocations()[state.coachIdx];if(d){const caption=cv.querySelector('.viewlabel')?.outerHTML||'';cv.innerHTML=scene(d.id,state.phase)+caption}}}
render();requestAnimationFrame(animate);
</script>
