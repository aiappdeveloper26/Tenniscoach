<script>
'use strict';
const STAGES={warm:{name:'Warm-up',icon:'☀️',hint:'Wake up the body. Make it playful.',target:2,weight:16},foot:{name:'Footwork',icon:'👟',hint:'Teach little steps before fast hitting.',target:2,weight:20},skill:{name:'Skills',icon:'🎾',hint:'Show the movement, then add the ball.',target:2,weight:39},game:{name:'Games',icon:'🏆',hint:'Finish with a success-focused challenge.',target:1,weight:18},cool:{name:'Cooldown',icon:'🌿',hint:'Slow down, stretch gently and reflect.',target:1,weight:7}};
const ORDER=Object.keys(STAGES);
const D=[
// Warm-ups
{id:'w1',stage:'warm',title:'Traffic Lights',sub:'Run, slow down and freeze on a colour.',mins:5,gear:'3 colour cones',goal:'Listening, stopping safely and moving in control.',say:'“Green: jog! Yellow: tiny steps! Red: freeze like a statue!”',setup:'Mark a short safe lane, with all children facing the same way.',steps:['Demonstrate the three signals without running.','Call a colour every 3–5 seconds; keep players moving in one direction.','Change the order and praise safe stops, not fastest runners.'],watch:'Bent knees and soft stopping steps; nobody collides.',fix:'Walk rather than jog; spread the children farther apart.',hard:'Add “blue = sideways steps” on a marked lane.',term:'Freeze = stop and hold still without wobbling.'},
{id:'w2',stage:'warm',title:'Follow the Leader',sub:'Copy a partner’s running path and turns.',mins:5,gear:'4 cones',goal:'Awareness, balance and direction changes.',say:'“Stay two big steps behind. Copy every turn!”',setup:'Set four cones to create one oval route; pair children.',steps:['Coach leads one slow lap and points out spacing.','One partner leads with walking, jogging and turns; partner copies.','Swap the leader after 30–40 seconds.'],watch:'Children look ahead and leave a two-step safety gap.',fix:'Make one big wide loop at walking pace.',hard:'Add a sidestep section between two cones.',term:'Leader = the child who chooses the path.'},
{id:'w3',stage:'warm',title:'Colour Cone Dash',sub:'Find the correct cone when you call it.',mins:4,gear:'3 coloured cones',goal:'Fast decisions and controlled movement.',say:'“Ready in the middle. Find BLUE! Touch it, then come back.”',setup:'Put three cones 2–3 m from a central start spot.',steps:['Name each cone colour while children point to it.','Call one colour; one child moves to touch it.','Child returns to the middle; change colours and players.'],watch:'Child changes direction without bumping others.',fix:'Use just two cones and allow walking.',hard:'Call a two-colour sequence in order.',term:'Reaction = moving after you see or hear a signal.'},
{id:'w4',stage:'warm',title:'Toss, Clap, Catch',sub:'Toss a soft ball and catch it again.',mins:5,gear:'1 soft ball / child',goal:'Track a ball with eyes and coordinate hands.',say:'“Eyes up. Tiny toss. Clap once. Catch softly!”',setup:'Each child stands in a separated personal space.',steps:['Show a tiny upward throw to head height.','Let children toss and catch with two hands.','When ready, add one clap before the catch.'],watch:'Eyes follow the ball; hands reach out softly.',fix:'Skip the clap and toss only a little above hands.',hard:'Try two claps or a gentle bounce before catching.',term:'Tracking = watching the ball until it reaches your hands.'},
{id:'w5',stage:'warm',title:'Animal Moves',sub:'Take turns hopping like a frog and stepping like a bear.',mins:5,gear:'2 cones',goal:'Whole-body coordination and gentle warming up.',say:'“Frog: small hop, soft landing. Bear: hands down, slow steps!”',setup:'Create a short 3–4 m lane with space between children.',steps:['Demonstrate two small frog hops and a quiet landing.','On the return, walk with hands and feet on the ground.','Alternate movements; let each child rest between turns.'],watch:'Soft landings; wrists and shoulders stay comfortable.',fix:'Replace bear steps with ordinary walking.',hard:'Add a sideways crab walk for one short trip.',term:'Landing soft = bend knees and make little noise.'},
{id:'w6',stage:'warm',title:'Side-Step Train',sub:'Travel left and right without crossing your feet.',mins:5,gear:'2 cones',goal:'Lateral movement for tennis.',say:'“Small steps sideways. Keep your feet apart!”',setup:'Mark a short 3 m corridor with a start and finish cone.',steps:['Face the net and demonstrate steps to the right.','Everyone side-steps one way, then comes back left.','Slow the rhythm, then gently increase pace.'],watch:'Shoulders mostly face forward; feet do not cross.',fix:'Use a shorter distance and step one beat at a time.',hard:'Hold a ready-position pose at the end of each trip.',term:'Side shuffle = move sideways using small, quick steps.'},
// Footwork
{id:'f1',stage:'foot',title:'Ready + Split Step',sub:'A tiny hop as the coach sends the ball.',mins:6,gear:'2 markers',goal:'React with feet apart and knees soft.',say:'“Ready… little hop… LAND… then move!”',setup:'Children face you from their own marked spots.',steps:['Show ready position: feet apart, knees soft, racket in front.','Say “hit” and do a tiny hop so both feet land apart.','Point left or right just as they land; they take two steps there.'],watch:'Hop stays tiny, both feet land softly before direction change.',fix:'Replace the hop with a small heel lift and wide landing.',hard:'Point only after your hand-feed starts.',term:'Split step = a small preparatory hop so you can move either way.'},
{id:'f2',stage:'foot',title:'Shuffle + Recover',sub:'Step sideways to a cone, then return to centre.',mins:6,gear:'3 cones',goal:'Move efficiently and regain ready position.',say:'“Shuffle right. Touch. Shuffle HOME. Ready!”',setup:'Centre cone plus one cone 2 m to either side.',steps:['Start at the centre in ready position.','Move sideways to one cone without crossing feet.','Move back to centre, stop, then repeat the other way.'],watch:'No feet crossing on short sideways moves; steady head height.',fix:'Bring cones closer and move slowly.',hard:'Use a coach pointing signal to select a side.',term:'Recover = come back to a useful middle position.'},
{id:'f3',stage:'foot',title:'Forward + Turn Home',sub:'Go to the short ball, turn and jog back.',mins:6,gear:'2 cones',goal:'Move forward and return safely.',say:'“Go FORWARD, bend, touch… TURN and jog home!”',setup:'Mark home spot and one cone 2–3 m in front.',steps:['Start at home with knees slightly bent.','Jog forward and touch the front cone.','Turn sideways, look, and jog back to home; no blind backwards sprinting.'],watch:'Child looks where they are going on the way back.',fix:'Use a walking pace and very short distance.',hard:'Hold a racket and show a pretend touch shot at the cone.',term:'Short ball = a ball landing nearer the net.'},
{id:'f4',stage:'foot',title:'Crossover Chase',sub:'Catch a far-away cone with a big first step.',mins:6,gear:'3 cones',goal:'Cover wider distances to a ball.',say:'“Turn your hips… cross your outside foot… RUN!”',setup:'Put wider cones 3–4 m from the middle.',steps:['Start in ready position and point to a wide cone.','Turn toward that side and take one crossing step to accelerate.','Run to the cone, then recover with small controlled steps.'],watch:'A turn comes before the crossing step; no twisting knee.',fix:'Walk through the turn and crossover first.',hard:'Add a pretend forehand at the far cone.',term:'Crossover step = one foot crosses in front to start a longer run.'},
{id:'f5',stage:'foot',title:'Triangle Feet',sub:'Visit left, front and home like a triangle.',mins:6,gear:'3 cones',goal:'Change direction and remember a route.',say:'“Left cone → front cone → HOME. Stop in ready position!”',setup:'Make a triangle of three cones with 2 m between them.',steps:['Walk the triangle together once.','A child travels from home to left, then front, then home.','Swap direction and repeat with small, controlled steps.'],watch:'Eyes look toward the next cone before turning.',fix:'Use a two-cone path only.',hard:'At each cone, show a quick shadow swing.',term:'Footwork pattern = a repeated route that trains movement.'},
{id:'f6',stage:'foot',title:'Point & Go',sub:'React to the coach’s pointing hand.',mins:5,gear:'3 cones',goal:'Quick first step and good balance.',say:'“Watch my HAND. One, two steps, stop!”',setup:'Create left, centre and right spots.',steps:['Stand in front of children and show a left/right point.','Children take two quick steps to that side then freeze.','Return to centre after each try; alternate sides.'],watch:'No false start; children look at the coach and stop balanced.',fix:'Hold the pointing signal for longer.',hard:'Add a gentle split step before the signal.',term:'First step = the first foot movement toward a ball.'},
// Skills
{id:'s1',stage:'skill',title:'Racket Pancake',sub:'Balance a ball on the racket like a pancake.',mins:7,gear:'Racket + soft ball',goal:'Control racket angle and keep eyes on the ball.',say:'“Racket flat like a tray. Walk slowly. Keep the ball asleep!”',setup:'One soft ball and one junior racket for each child.',steps:['Demonstrate an almost flat racket face at waist height.','Put a ball in the middle; hold still for five seconds.','Walk between two markers without dropping the ball.'],watch:'Calm hands and a mostly level racket face.',fix:'Start with a beanbag or foam ball and stand still.',hard:'Add a gentle racket bounce or a curved route.',term:'Racket face = the flat string area that touches the ball.'},
{id:'s2',stage:'skill',title:'Forehand Shadow Swing',sub:'Practise the forward-side swing with no ball.',mins:8,gear:'Racket only',goal:'Learn a relaxed low-to-high forehand movement.',say:'“Turn sideways, swing from LOW to HIGH, finish by your shoulder!”',setup:'Children spread out by at least a racket-length plus safety space.',steps:['Show the ready pose with racket in front.','Turn shoulders to the racket side, then swing smoothly from low to high.','Finish above the opposite shoulder and return to ready.'],watch:'Balanced feet, easy swing, and imaginary contact in front.',fix:'Do the motion without a racket first.',hard:'Add a coach-counted step before swinging.',term:'Forehand = the shot hit on your racket-hand side after a bounce.'},
{id:'s3',stage:'skill',title:'Forehand Drop & Hit',sub:'Let a soft ball bounce once, then hit it forward.',mins:9,gear:'Racket + red/orange balls',goal:'Time a simple forehand contact.',say:'“DROP… BOUNCE… HIT in FRONT… finish high!”',setup:'Use a mini-court and a clear forward target. One hitter per lane.',steps:['Coach demonstrates a gentle hand-drop on the hitting side.','Child drops the ball, lets it bounce once, then swings forward.','Aim across a low net or marked line; retrieve only on your signal.'],watch:'Ball contacted a little in front of body; no huge swing.',fix:'Coach drops the ball closer; move start position nearer the net.',hard:'Coach hand-feeds a gentle side toss.',term:'Contact point = where the racket meets the ball.'},
{id:'s4',stage:'skill',title:'Two-Hand Backhand',sub:'Make a smooth stroke on the opposite side.',mins:8,gear:'Junior racket',goal:'Turn shoulders and move both hands together.',say:'“Two hands together. Turn… swing… finish across!”',setup:'One shadow-swing lane per child, with wide spacing.',steps:['Put both hands on the handle; show the racket on the non-dominant side.','Turn shoulders as one unit and make a slow low-to-high swing.','Finish comfortably toward the opposite shoulder; reset.'],watch:'Two hands remain together and the child stays balanced.',fix:'Practise very slowly without a ball.',hard:'Add a soft self-drop and bounce before hitting.',term:'Backhand = a stroke on the side opposite your forehand.'},
{id:'s5',stage:'skill',title:'Backhand Contact Window',sub:'Meet a softly fed ball out in front on the backhand side.',mins:8,gear:'Racket + soft balls',goal:'Find the right place to meet the ball.',say:'“Turn early. Step. Meet the ball HERE, in front!”',setup:'Coach stands safely to the side and tosses a soft ball to backhand side.',steps:['Child starts ready with two hands on racket.','Coach underhand-tosses a gentle ball to bounce at the backhand-side marker.','Child turns, steps, and meets the ball slightly ahead of the front hip.'],watch:'Contact is out in front, not trapped beside or behind the body.',fix:'Freeze at the contact point with a stationary held ball.',hard:'Vary the gentle feed by one small step to either side.',term:'Contact window = the small area where hitting the ball feels easiest.'},
{id:'s6',stage:'skill',title:'Soft Volley Block',sub:'Stop the ball before it bounces near the net.',mins:8,gear:'Racket + foam balls',goal:'Keep the racket in front and use a short volley.',say:'“Racket UP. Little step. BLOCK—no big swing!”',setup:'Coach underhand-tosses a foam ball from a safe, short distance.',steps:['Show racket head above hand and knees softly bent.','Coach gives a slow chest-height toss while child steps toward it.','Child uses a short firm block back to an open target area.'],watch:'Ball is hit before bounce; no big backswing near other children.',fix:'Catch the ball on the strings or use an extra-soft hand toss.',hard:'Alternate gentle tosses to forehand and backhand sides.',term:'Volley = hit the ball in the air, before it bounces.'},
{id:'s7',stage:'skill',title:'Serve Toss to the Sky',sub:'Learn a calm upward toss before trying a serve.',mins:7,gear:'1 soft ball / child',goal:'Send the ball up in a controlled vertical line.',say:'“Arm long… lift the ball UP… catch it in front!”',setup:'Children each stand behind their own line, well separated.',steps:['Stand side-on and hold a soft ball in the non-racket hand.','Lift the arm smoothly to release the ball just above reach.','Watch its rise, let it fall and catch; no hitting yet.'],watch:'Quiet head, relaxed straight lifting arm, toss not thrown forward.',fix:'Start with release only a few centimetres above the hand.',hard:'Add racket in trophy pose, still without striking.',term:'Toss = lifting and releasing the ball to start a serve.'},
{id:'s8',stage:'skill',title:'Mini-Court Rally',sub:'Send a soft ball back and forth over a low net.',mins:10,gear:'2 rackets + slow ball',goal:'Develop cooperative rallying.',say:'“Bounce once… send it gently… help your partner!”',setup:'Pairs stand close across a mini-net or a safe marked line.',steps:['Begin with one hand-feed, then a gentle racket return.','Partners try one bounce then one hit across the net.','Count their best consecutive returns; aim for three together.'],watch:'Small swings and kind feeds; both partners have space.',fix:'Allow bounce-and-catch before a hand toss back.',hard:'Ask for five cooperative hits in a row.',term:'Rally = a sequence of shots sent back and forth.'},
// Games
{id:'g1',stage:'game',title:'Cone Castle',sub:'Knock down a small cone tower with a soft shot.',mins:8,gear:'Cones + soft balls',goal:'Aim instead of hitting hard.',say:'“Pick a castle. Eyes on target. Gentle hit—can you topple it?”',setup:'Build 2–3 low cone targets, far from waiting players.',steps:['Let each child choose a target cone.','Child self-drops or receives a gentle coach feed and aims softly.','Celebrate near misses as well as hits; reset the tower.'],watch:'Children aim before swinging; waiting players remain behind line.',fix:'Make the target wider or allow underarm rolls.',hard:'Move the castle slightly farther away.',term:'Target = the area you want the ball to reach.'},
{id:'g2',stage:'game',title:'Clean the Court',sub:'Cooperative team game moving balls across a line.',mins:8,gear:'Several soft balls',goal:'Cooperation, accuracy and active movement.',say:'“Send the balls gently to the other side. Stop when I say FREEZE!”',setup:'Two teams stand on separate halves divided by a clear line; no hard throws.',steps:['Place the same number of foam balls on both sides.','For 30–45 seconds, players roll or gently send balls across.','Freeze, count together, and repeat with a teamwork challenge.'],watch:'No throwing at people; everyone respects the centre line.',fix:'All balls are rolled along the ground.',hard:'Use a racket to guide the ball rather than hands.',term:'Cooperative = working together rather than only trying to win.'},
{id:'g3',stage:'game',title:'Rally Ladder',sub:'Build a shared best rally: 2, then 3, then 5.',mins:9,gear:'Mini-net + slow balls',goal:'Encourage steady control and confidence.',say:'“Two together! Can we beat our record with three?”',setup:'Make pairs on small courts with lots of space.',steps:['Partners start with a gentle feed and try two returns in a row.','After success, celebrate and aim for three, then five.','Reset the challenge after a miss with no penalty.'],watch:'Players control speed and help each other succeed.',fix:'Allow catching and tossing for the first two rounds.',hard:'Try five hits with a direction target.',term:'Consecutive = one after another without a miss.'},
{id:'g4',stage:'game',title:'Treasure Island',sub:'Earn a marker by sending a ball into an island.',mins:9,gear:'Hoops/cones + tokens',goal:'Learn simple shot placement in a playful format.',say:'“Hit the island! When you land one, collect one treasure!”',setup:'Make a marked target island; keep treasures away from active hitting lanes.',steps:['Show the island area clearly with cones or a hoop.','Each child takes one gentle hit toward the island.','Award one token for landing inside; collect between rounds only.'],watch:'Children do not run into court while another is swinging.',fix:'Broaden the island or allow ball rolls.',hard:'Offer two islands with different target distances.',term:'Placement = choosing where a ball should land.'},
{id:'g5',stage:'game',title:'Hit & Rotate',sub:'Hit once, then move to the back of the queue.',mins:8,gear:'Mini-net + 3 cones',goal:'Build teamwork and smooth transitions.',say:'“HIT… move around the OUTSIDE… join the back!”',setup:'One marked hitting spot and a separate safe return route.',steps:['Demonstrate a single gentle shot from the front of the queue.','After the shot, player follows cones around the outside to queue end.','Next player steps into hitting spot only after the lane is clear.'],watch:'Players never cross behind an active swinging racket.',fix:'Replace hitting with a catch-and-throw return.',hard:'Try a group target of ten successful shots.',term:'Rotation = changing turns in a clear, safe order.'},
{id:'g6',stage:'game',title:'Target Zones',sub:'Pick one landing zone before the shot.',mins:9,gear:'Flat markers + slow balls',goal:'Combine aiming with gentle control.',say:'“Choose LEFT or RIGHT. Point at it. Now aim!”',setup:'Mark two wide target boxes on the far side of a mini-net.',steps:['Ask a child to say or point to one target zone.','Coach feeds an easy ball; child hits softly toward that box.','Mark success with a team tally; rotate players.'],watch:'Choice happens before hitting; child does not over-swing.',fix:'Targets are closer and wider; allow underarm tossing.',hard:'Add a middle zone and switch targets on a signal.',term:'Zone = a marked section of the playing area.'},
// Cooldowns
{id:'c1',stage:'cool',title:'Walk + Big Breaths',sub:'Slow walk followed by gentle breathing.',mins:3,gear:'None',goal:'Let effort settle and finish calmly.',say:'“Walk slowly. Smell a flower… blow a candle!”',setup:'Gather players in a wide spaced circle.',steps:['Walk around the circle slowly for 30–60 seconds.','Stop, breathe in gently through the nose, then out slowly.','Repeat three easy breaths without holding breath.'],watch:'Shoulders soften and no one feels dizzy.',fix:'Breathe normally if deep breaths feel uncomfortable.',hard:'Let a child lead a relaxed breathing count.',term:'Cooldown = a gradual return to calm movement.'},
{id:'c2',stage:'cool',title:'Calf Stretch',sub:'One foot back, heel gently toward the floor.',mins:3,gear:'Wall/fence optional',goal:'Notice tight lower-leg muscles safely.',say:'“Back foot flat. Tiny lean. Feel a gentle stretch.”',setup:'Use fence support if needed, with enough distance between players.',steps:['Put one foot forward and one a little behind.','Keep back heel down and gently bend the front knee.','Hold comfortably about 10–15 seconds; swap sides.'],watch:'No bouncing or pushing into pain.',fix:'Make the step smaller and use a wall for balance.',hard:'Ask children where they feel the stretch in the back calf.',term:'Calf = the muscle at the back of your lower leg.'},
{id:'c3',stage:'cool',title:'Front-Thigh Stretch',sub:'Gently bend one knee while holding support.',mins:3,gear:'Fence optional',goal:'Gentle quadriceps mobility and balance.',say:'“Hold the fence. Bend your knee. Soft and easy.”',setup:'Children stand beside a fence or in personal spaces.',steps:['Hold a fence for balance and stand tall.','Bend one knee; hold ankle gently if comfortable.','Keep knees close, hold briefly, then switch legs.'],watch:'No pulling hard on the foot and no knee pain.',fix:'Skip the ankle hold; simply bend and release the knee.',hard:'Try balancing for two seconds without support only if steady.',term:'Quadriceps = the muscles on the front of the thigh.'},
{id:'c4',stage:'cool',title:'Shoulder Hug',sub:'A relaxed across-the-body arm stretch.',mins:3,gear:'None',goal:'Calmly release shoulder tension.',say:'“Hug one arm across your chest. No pulling hard.”',setup:'Stand with enough room to open both arms.',steps:['Bring one arm gently across the upper chest.','Use the other hand to support that arm, not the elbow joint.','Hold 10–15 seconds, release, and swap arms.'],watch:'Shoulders stay relaxed; stretching never hurts.',fix:'Use a smaller, comfortable arm movement.',hard:'Follow with two slow shoulder rolls.',term:'Across-the-body stretch = arm gently rests over chest.'},
{id:'c5',stage:'cool',title:'High-Five Reflection',sub:'Celebrate effort and choose one thing to improve.',mins:3,gear:'None',goal:'Build confidence and finish positively.',say:'“One thing you did well? One thing you’ll try next time?”',setup:'Gather in a relaxed circle away from loose balls.',steps:['Invite each child to name one success from today.','Ask what the group would like to try next lesson.','Offer optional high-fives and remind everyone to collect gear.'],watch:'Every child gets a chance; no teasing or forced sharing.',fix:'Invite children to show a thumbs-up instead of speaking.',hard:'Ask children to remember one new tennis term.',term:'Reflection = thinking about what you learned.'}
];
D.push(...[{"id":"s9","stage":"skill","title":"Forehand Ready & Turn","sub":"Turn shoulders before the ball arrives.","mins":7,"gear":"Racket, soft ball","goal":"Turn sideways early and point your non-racket shoulder toward the feed.","say":"“See the ball. Turn your shoulders. Wait!”","setup":"Coach hand-feeds gently from 2–3 m away.","steps":["Show ready position with racket in front.","Point with the free hand and turn shoulders toward the hitting side.","Freeze the turned position as the ball travels; then catch it."],"watch":"Shoulders turn together, not just the racket arm.","fix":"Practise without a ball first.","hard":"Add a simple drop-feed swing.","term":"Unit turn = moving your shoulders and racket together."},{"id":"s10","stage":"skill","title":"Forehand Contact Point","sub":"Meet the ball in front of the body.","mins":7,"gear":"Racket, foam balls","goal":"Hit slightly in front of the front hip with relaxed arm.","say":"“Let it bounce. Meet it IN FRONT!”","setup":"Coach drops a soft ball beside the child.","steps":["Show where contact should happen using a stationary ball.","Drop the ball just in front of the child’s racket side.","Ask for a gentle forward push into a target."],"watch":"Contact happens in front, not behind the hip.","fix":"Catch first, then try a tap.","hard":"Feed from slightly different positions.","term":"Contact point = where strings touch the ball."},{"id":"s11","stage":"skill","title":"Forehand Finish High","sub":"Follow through after contact.","mins":7,"gear":"Racket, balls","goal":"Finish over the opposite shoulder without forcing the wrist.","say":"“Brush up and show your racket by your shoulder!”","setup":"Coach stands across a mini-court to feed gently.","steps":["Start with three slow shadow swings.","Drop-feed a ball and swing gently low to high.","Hold the balanced finish for two seconds."],"watch":"Child stays balanced and does not stop the racket suddenly.","fix":"Use an imaginary ball.","hard":"Aim beyond the service line with a gentle feed.","term":"Follow-through = letting the racket continue after hitting."},{"id":"s12","stage":"skill","title":"Forehand Crosscourt Target","sub":"Aim diagonally into a big zone.","mins":7,"gear":"Cones, racket, red balls","goal":"Send the forehand across the mini-court.","say":"“Turn, point to the big diagonal island, then swing!”","setup":"Mark a large diagonal landing zone.","steps":["Point out the target before each feed.","Drop-feed or coach hand-feed a soft ball.","Count controlled shots that land anywhere in the big zone."],"watch":"Direction comes from setup and contact, not a wild wrist flick.","fix":"Move the target closer and larger.","hard":"Make the landing zone narrower.","term":"Crosscourt = hitting diagonally across the court."},{"id":"s13","stage":"skill","title":"Forehand Down-the-Line","sub":"Aim along the sideline.","mins":7,"gear":"Cones, racket, balls","goal":"Control direction without swinging harder.","say":"“Same smooth swing—aim STRAIGHT ahead!”","setup":"Put a broad target parallel to the sideline.","steps":["Walk the intended straight path from hitter to target.","Hand-feed easy forehands.","Let each child choose crosscourt or straight before hitting."],"watch":"Controlled racket face and safe landing area.","fix":"Move target toward the middle.","hard":"Alternate diagonal and straight targets.","term":"Down-the-line = a shot travelling roughly parallel to the sideline."},{"id":"s14","stage":"skill","title":"Forehand Move & Hit","sub":"Move to the ball before swinging.","mins":7,"gear":"3 cones, racket, balls","goal":"Shuffle, stop, hit, then recover.","say":"“Move your FEET. Stop. Hit. Back home!”","setup":"Home cone and one feed spot a step to the side.","steps":["Start at home in ready position.","Coach sends an easy ball a step to one side.","Child shuffles, balances, swings, then returns home."],"watch":"Feet adjust before contact; no falling sideways.","fix":"Shorten the feed distance.","hard":"Feed to alternating sides.","term":"Adjustment steps = tiny final steps to line up with the ball."},{"id":"s15","stage":"skill","title":"Two-Hand Backhand Grip","sub":"Learn safe two-hand placement.","mins":7,"gear":"Racket","goal":"Hold the racket with two hands, relaxed and ready.","say":"“Both hands together. Hold softly, not super tight!”","setup":"Everyone stands spaced apart with a junior racket.","steps":["Let each child place the dominant hand near the bottom.","Place the second hand above it and show a relaxed grip.","Turn both shoulders and move the racket together."],"watch":"Hands stay near each other; arms relaxed.","fix":"Coach places hands on an unmoving racket with permission.","hard":"Add a slow shadow swing.","term":"Two-handed backhand = hitting on the non-racket side with both hands."},{"id":"s16","stage":"skill","title":"Backhand Shadow Swing","sub":"Turn and swing on the backhand side.","mins":7,"gear":"Racket","goal":"Keep both hands on the racket through contact.","say":"“Turn sideways, step, swing, finish high!”","setup":"Stand an arm-and-racket length apart.","steps":["Begin with a two-hand grip and ready stance.","Turn shoulders toward the backhand side.","Step, swing smoothly and hold the finish."],"watch":"Shoulder turn and balanced finish, not just hand flicking.","fix":"Start without a racket and pretend to hold one.","hard":"Add a ball tossed slowly after the shadow.","term":"Backhand = stroke on the opposite side from a forehand."},{"id":"s17","stage":"skill","title":"Backhand Drop Feed","sub":"Hit after a gentle bounce.","mins":7,"gear":"Racket, red balls","goal":"Control a two-hand backhand from a simple feed.","say":"“Bounce… step… push through and finish!”","setup":"Coach drops balls slightly in front of backhand hip.","steps":["Demonstrate a backhand grip and sideways turn.","Drop the ball and let it bounce once.","Child gently strikes toward a nearby open area."],"watch":"Ball met in front; both hands remain on the handle.","fix":"Use a stationary foam ball held by coach safely away from swing.","hard":"Aim to a large cone target.","term":"Drop feed = releasing the ball from the hand to bounce before hitting."},{"id":"s18","stage":"skill","title":"Backhand Contact Window","sub":"Find the correct hitting space.","mins":7,"gear":"Racket, foam balls","goal":"Meet backhands ahead of the body.","say":"“Turn early. Meet the ball HERE in front!”","setup":"Put a marker where the ideal contact area is.","steps":["Child stands sideways and points to a contact window.","Coach softly tosses a ball into that window.","Child tries a short, balanced swing and freezes contact position."],"watch":"Racket stays ahead of the front hip.","fix":"Catch the ball at the contact marker.","hard":"Change the feed height slightly.","term":"Contact window = useful space to meet the ball."},{"id":"s19","stage":"skill","title":"Backhand Crosscourt Target","sub":"Aim a backhand diagonally.","mins":7,"gear":"Cones, racket, balls","goal":"Guide backhands into a generous diagonal target.","say":"“Turn first. Smooth swing to the far corner!”","setup":"Set a large diagonal target within a mini-court.","steps":["Walk the ball’s desired diagonal path.","Hand-feed gentle backhands.","Give one point for each controlled ball into the zone."],"watch":"Balanced two-hand finish and smooth direction control.","fix":"Move target toward centre.","hard":"Alternate deep and short crosscourt zones.","term":"Crosscourt backhand = backhand sent diagonally."},{"id":"s20","stage":"skill","title":"Backhand Move & Recover","sub":"Shuffle to backhand then return.","mins":7,"gear":"3 cones, racket, balls","goal":"Combine footwork and two-hand stroke.","say":"“Side steps, stop, backhand, go HOME!”","setup":"Set home and backhand-side cone 1–2 m apart.","steps":["Start with two slow practice shuffles.","Feed an easy ball toward backhand side.","Child moves, hits softly and returns to home cone."],"watch":"Early shoulder turn while feet move.","fix":"Use no ball and shadow a swing.","hard":"Alternate forehand and backhand feeds.","term":"Recovery = return to a useful court position."},{"id":"s21","stage":"skill","title":"Forehand vs Backhand Choice","sub":"Choose the correct stroke for the ball.","mins":7,"gear":"Racket, soft balls","goal":"React to forehand and backhand feeds without guessing.","say":"“Watch the BALL—not my hand. Turn to that side!”","setup":"Coach feeds from middle with two safe side zones.","steps":["Demonstrate which side is forehand and which is backhand.","Give easy alternating feeds, telling the child the side.","Remove the verbal cue once they are comfortable."],"watch":"Child turns to the correct side before swinging.","fix":"Start by catching instead of hitting.","hard":"Send random but gentle feeds.","term":"Stroke selection = choosing forehand or backhand for the ball."},{"id":"s22","stage":"skill","title":"Backhand Slice Introduction","sub":"Feel a soft high-to-low racket path.","mins":7,"gear":"Racket, foam balls","goal":"Short, controlled slice touch—not a chopping motion.","say":"“Racket starts a little high. Glide forward and down.”","setup":"Coach feeds soft slow balls in a small area.","steps":["Demonstrate a short high-to-low racket path.","Practise five slow shadow movements.","Try gently brushing the back of a foam ball across the court."],"watch":"No hard wrist chopping; keep swing short.","fix":"Skip ball and use shadow only.","hard":"Aim low over a mini-net.","term":"Slice = brushing slightly down the back of the ball."},{"id":"s23","stage":"skill","title":"Volley Ready Position","sub":"Get ready near the net.","mins":7,"gear":"Racket, net","goal":"Racket up and short movement.","say":"“Racket in front like a shield. Tiny step!”","setup":"Children stand safely near a lowered net.","steps":["Show racket head up in front of the body.","Coach points forehand or backhand and child makes a tiny step.","Freeze with the racket face steady."],"watch":"No huge backswing; hands out in front.","fix":"Practise without a ball.","hard":"Add a slow foam-ball hand-feed.","term":"Volley = hitting before the ball bounces."},{"id":"s24","stage":"skill","title":"Forehand Volley Catch & Tap","sub":"Short forehand-side volley.","mins":7,"gear":"Foam balls, racket","goal":"Intercept a gently tossed ball before its bounce.","say":"“Step, show the strings, little TAP!”","setup":"Hand-feed from very close on the forehand side.","steps":["Start by catching a foam ball in front.","Hold racket in front and take a small forward step.","Coach tosses softly; child blocks it over low net."],"watch":"Short punch and stable racket head.","fix":"Tap a balloon first.","hard":"Aim forehand volleys into a marked box.","term":"Block volley = redirect with a short stable racket movement."},{"id":"s25","stage":"skill","title":"Backhand Volley Catch & Tap","sub":"Short backhand-side volley.","mins":7,"gear":"Foam balls, racket","goal":"Keep racket up on the backhand side.","say":"“Turn a little, step, block—no big swing!”","setup":"Feed softly to the backhand side at net.","steps":["Catch a tossed foam ball with two hands on the backhand side.","Place racket in the same contact space.","Try a soft blocking volley toward a big target."],"watch":"Contact in front and no full backswing.","fix":"Use a balloon or slower feed.","hard":"Alternate forehand/backhand volleys.","term":"Backhand volley = hitting a ball before bounce on backhand side."},{"id":"s26","stage":"skill","title":"Overhead Catch & Point","sub":"Track a high ball first.","mins":7,"gear":"Soft ball","goal":"Get under the ball safely before overhead striking.","say":"“Turn sideways, point up, catch above your head!”","setup":"Clear space; underarm toss soft balls high but not too far.","steps":["Child turns sideways and points non-racket hand upward.","Coach tosses a high foam ball.","Child moves feet and catches it comfortably overhead."],"watch":"Eyes on ball; safe space; do not run blindly backward.","fix":"Use lower toss and remain stationary.","hard":"Catch then shadow an overhead swing.","term":"Overhead = contacting a high ball above the head."},{"id":"s27","stage":"skill","title":"Serve Trophy Pose","sub":"Learn a balanced serve preparation.","mins":7,"gear":"Racket","goal":"Front shoulder faces net, elbow bent comfortably.","say":"“Stand sideways. Elbow up. Freeze like a trophy!”","setup":"Use no balls, with players safely apart.","steps":["Stand sideways with front foot pointing toward net post.","Raise tossing arm; bend racket arm into comfortable preparation.","Hold a relaxed trophy pose for two seconds."],"watch":"No forced back arch; feet stable.","fix":"Practise with empty hands.","hard":"Add a small ball toss with the other hand.","term":"Trophy position = brief balanced pose before serving up."},{"id":"s28","stage":"skill","title":"Serve Toss to Target","sub":"Toss into a reliable small area.","mins":7,"gear":"Soft ball, ground marker","goal":"Repeat gentle tosses without hitting yet.","say":"“Straight arm, gentle lift, let it go!”","setup":"Set a hoop or marker just in front of the player.","steps":["Show an open palm with the ball on fingertips.","Raise tossing arm and release the ball gently.","Try catching after toss or landing ball near marker."],"watch":"Toss goes upward, not thrown forward like a baseball.","fix":"Try a lower toss and catch.","hard":"Repeat three similar tosses in a row.","term":"Ball toss = controlled release that sets up the serve."},{"id":"s29","stage":"skill","title":"Underarm Serve","sub":"Begin the point with an easy serve.","mins":7,"gear":"Racket, soft balls","goal":"Roll or tap a ball into the service box.","say":"“Drop, gently tap, aim across the net!”","setup":"Play on a scaled court and mark service box.","steps":["Show how to drop the ball in front.","Swing upward gently after a single bounce or directly from hand.","Aim into a large diagonal service box."],"watch":"Safe spacing and aim; not a hard hit.","fix":"Roll the ball across a low line first.","hard":"Serve to left and right targets.","term":"Underarm serve = starting the point from below shoulder height."},{"id":"s30","stage":"skill","title":"Half Serve / Throwing Motion","sub":"Connect body turn to upward throw.","mins":7,"gear":"Foam ball, racket optional","goal":"Use a gentle, abbreviated overhead movement.","say":"“Turn sideways. Reach up. Throw HIGH and forward!”","setup":"Children throw foam balls from a safe serving station.","steps":["Begin sideways with a soft foam ball.","Practise tossing the ball upward and forward over net.","Try a gentle short racket swing with no ball first."],"watch":"Comfortable shoulder range; no excessive arch.","fix":"Throw from closer to the net.","hard":"Aim at a marked service box.","term":"Service motion = coordinated upward movement to start the point."},{"id":"s31","stage":"skill","title":"Rally Three in a Row","sub":"Build consistency, not power.","mins":7,"gear":"Scaled court, red balls","goal":"Try three controlled shots with a partner.","say":"“Soft hands. One bounce. Help your partner!”","setup":"Pair children on short courts with space between lanes.","steps":["Start with one bounce and catch each side.","Progress to gentle forehand taps with one bounce.","Count cooperative streaks of three good exchanges."],"watch":"Partner can reach the ball; pace remains slow.","fix":"Use bounce-catch-bounce-throw.","hard":"Aim for five or more exchanges.","term":"Rally = players sending the ball back and forth."},{"id":"s32","stage":"skill","title":"Return of Serve Ready","sub":"Watch the server and block the ball back.","mins":7,"gear":"Racket, soft balls","goal":"Prepare early for a gentle underarm serve.","say":"“Ready feet, eyes on ball, short swing!”","setup":"One player underarm-serves from close distance.","steps":["Receiver adopts ready position before the serve.","Server sends a very gentle ball.","Receiver steps and uses short controlled swing to open target."],"watch":"Receiver reacts after the ball leaves server.","fix":"Start with catch rather than return.","hard":"Alternate left and right serve placements.","term":"Return = the first shot after an opponent’s serve."}]);

function templatePicker(){return `<section class="section"><div class="section-head"><div><div class="eyebrow">START WITH A LESSON</div><h2>Ready-made lesson menus</h2><p>Tap a focus to load it, then add, remove or swap any activity below. Changes do not overwrite the template.</p></div></div><div class="template-scroll">${TEMPLATES.map(x=>`<button class="template-card ${state.template===x.id?'active':''}" data-act="template" data-id="${x.id}"><span style="font-size:24px">${x.emoji}</span><strong>${safe(x.name)}</strong><small>${safe(x.desc)}</small><span class="template-cta">${state.template===x.id?'✓ Loaded':'Use this lesson →'}</span></button>`).join('')}</div></section>`}
function applyTemplate(id){const x=TEMPLATES.find(t=>t.id===id);if(!x)return;state.selected=x.selected.filter(z=>BYID[z]);state.template=id;state.stage='skill';state.seconds=null;state.coachIdx=0;state.running=false;state.finished=false;state.view='build';persist();render();toast('Loaded '+x.name+' — customise any drill');}


const MISTAKES=[{"id":"m1","category":"Warm-up","title":"Runs into other children","spot":"Children cross paths or cannot stop on a signal","why":"Too little spacing or exciting chase rules","cue":"Freeze like a statue; stay in your lane","fix":"Set two cone lanes; walk, jog, then freeze on colour","success":"Stops safely on 4 of 5 calls","drill":"w1"},{"id":"m2","category":"Warm-up","title":"Starts at full speed without warming up","spot":"Sprints immediately while still stiff","why":"Warm-up has no gradual progression","cue":"Start slow, then grow your speed","fix":"Walk, side-step, jog and only then short accelerations","success":"Builds up effort gradually","drill":"w6"},{"id":"m3","category":"Warm-up","title":"Watches the floor instead of the ball","spot":"Misses catches and loses track of ball flight","why":"Tracking and hand-eye coordination are developing","cue":"Watch the ball all the way into your hands","fix":"Use a large soft ball; toss at eye height and catch after a bounce","success":"Catches 4 of 5 easy tosses","drill":"w4"},{"id":"m4","category":"Warm-up","title":"Rushes and loses balance","spot":"Stumbles when changing directions","why":"Steps are too large for current balance ability","cue":"Little steps before a big turn","fix":"Put cones closer and practise controlled stops","success":"Balances at each marker","drill":"w3"},{"id":"m5","category":"Warm-up","title":"Does not follow the start-stop instruction","spot":"Moves before the cue or keeps going after stop","why":"More than one instruction given at once","cue":"Wait for green; red means freeze","fix":"Use just green and red, then add yellow","success":"Responds correctly on 4 of 5 cues","drill":"w1"},{"id":"m6","category":"Footwork","title":"Stands upright with straight knees","spot":"Looks stiff and reacts slowly","why":"Ready position has not been established","cue":"Soft knees, eyes forward","fix":"Hold ready pose for three seconds, then respond to a point","success":"Starts from soft kne :"Uses frying-pan grip without experimenting","spot":"Racket face points like a tray throughout","why":"Grip is naturally familiar from groundstrokes","cue":"Try the handshake grip gently","fix":"Use racket-edge throwing shadow without ball","success":"Can show comfortable chopper grip","drill":"s29"},{"id":"m48","category":"Serve","title":"Tries to smash every serve","spot":"Misses frequently; control disappears","why":"Accuracy not yet developed","cue":"Gentle serve into the big box","fix":"Serve from shortened distance with soft ball","success":"3/5 into enlarged service target","drill":"s30"},{"id":"m49","category":"Serve","title":"Hits with bent arm too low","spot":"Ball meets racket too close to head","why":"Toss, reach and timing not coordinated","cue":"Reach tall at contact","fix":"Shadow reach to a high foam target, never force joint","success":"Comfortable upward reach on repeats","drill":"s29"},{"id":"m50","category":"Serve","title":"Steps across baseline before striking","spot":"Foot crosses line early","why":"Footwork sequence not understood","cue":"Start behind the line until contact","fix":"Put flat marker behind baseline; shadow legal serves","success":"4/5 starts behind line","drill":"s30"},{"id":"m51","category":"Serve","title":"Toss and swing happen at different times","spot":"Child swings when ball is already falling too far","why":"Too much to coordinate at once","cue":"Toss, look, reach","fix":"Alternate toss-and-catch and half-speed service motion","success":"Clean timing in 3/5 tries","drill":"s30"},{"id":"m52","category":"Rally","title":"Hits every ball as hard as possible","spot":"Rally breaks after one shot","why":"Winning focus crowds out cooperation","cue":"Help your partner play the next ball","fix":"Count gentle cooperative exchanges","success":"3-ball shared rally","drill":"s31"},{"id":"m53","category":"Rally","title":"Aims straight at partner's body","spot":"Partner cannot return comfortably","why":"No target awareness","cue":"Send to their easy hitting space","fix":"Mark safe bounce zone near partner","success":"3/5 partner-friendly balls","drill":"s8"},{"id":"m54","category":"Rally","title":"Keeps standing inside ball's bounce zone","spot":"Cannot time bounce cleanly","why":"Distance from bounce misunderstood","cue":"Watch bounce, move, then hit","fix":"Self-drop-feed and hit after one bounce","success":"4/5 clean bounces and hits","drill":"s31"},{"id":"m55","category":"Rally","title":"Never resets after a shot","spot":"Not ready for return","why":"Recovery step forgotten","cue":"Hit, home, ready","fix":"Mini rally with centre home spots","success":"Recovers on 4/5 turns","drill":"s32"},{"id":"m56","category":"Rally","title":"Has trouble judging high or low bounce","spot":"Swings at wrong height","why":"Ball tracking still developing","cue":"Say bounce when it lands","fix":"Coach mixes two slow bounce heights","success":"Calls bounce accurately 4/5","drill":"s8"},{"id":"m57","category":"Rally","title":"Gives up after one missed shot","spot":"Stops participating or becomes upset","why":"Task may feel too competitive","cue":"Mistakes are practice; let's try one more","fix":"Play team best-of-five attempts, praise effort","success":"Re-engages after mistake","drill":"g3"},{"id":"m58","category":"Games","title":"Argues over points","spot":"Children dispute scores and stop playing","why":"Rules not clear or too many","cue":"Call score together before playing","fix":"Use one-point games with visible tokens","success":"States score calmly each point","drill":"g3"},{"id":"m59","category":"Games","title":"Long queues leave children standing","spot":"Only one player active at a time","why":"Stations not set up for group size","cue":"Everyone gets a job","fix":"Run paired activities or two mini-courts","success":"Most kids active most of time","drill":"g5"},{"id":"m60","category":"Games","title":"Swings while another child is nearby","spot":"Racket almost contacts another child","why":"Swinging zones not defined","cue":"Rackets sleep until space is clear","fix":"Mark separated waiting/hitting spots","success":"All swings within safe area","drill":"g5"},{"id":"m61","category":"Games","title":"Focuses only on winning","spot":"Refuses to cooperate or celebrate peers","why":"Success is framed as beating others","cue":"Can we beat our team best?","fix":"Use cooperative rally ladder","success":"Encourages partner and keeps trying","drill":"g3"},{"id":"m62","category":"Cooldown","title":"Stops suddenly and sits down","spot":"Class ends without settling effort","why":"Cool-down skipped to save time","cue":"Walk slowly with me first","fix":"Easy walk and calm breathing for 2 minutes","success":"Returns to relaxed breathing","drill":"c1"},{"id":"m63","category":"Cooldown","title":"Forces stretch or bounces aggressively","spot":"Child pushes until discomfort","why":"Stretching feels like a competition","cue":"Gentle only; never pain","fix":"Show slow comfortable hold; allow choice to skip","success":"Demonstrates gentle stretch without pain","drill":"c2"},{"id":"m64","category":"Cooldown","title":"Cannot recall what improved","spot":"Says 'nothing' or only mentions winning","why":"Reflection question too broad","cue":"Tell me one thing you tried","fix":"Ask one easy success and one next-time goal","success":"Names one effort or improvement","drill":"c5"}];
const MISTAKE_BY_ID=Object.fromEntries(MISTAKES.map(m=>[m.id,m]));
const START=['w1','w4','f1','f2','s2','s3','g1','c1'];
const KEY='little-rally-v1';
let storageOkay=false;
try{const t='__little_rally_probe';localStorage.setItem(t,'ok');storageOkay=localStorage.getItem(t)==='ok';localStorage.removeItem(t)}catch(e){storageOkay=false}
let initial={age:'8-10',level:'new',duration:60,group:6,selected:START,saved:[],template:'mix',students:[],activeStudent:'',sessions:[],mistakeFlags:[]};
if(storageOkay){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')initial={...initial,...x}}catch(e){}}
let state={...initial,view:'build',stage:'warm',filter:'all',search:'',coachIdx:0,seconds:null,running:false,finished:false,modalId:null,chartSkill:'fore',mistakeCategory:'All',mistakeSearch:'',mistakeFocus:'',phase:0.18,speed:1,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,deadline:null};
state.selected=Array.isArray(state.selected)?[...new Set(state.selected.filter(x=>BYID[x]))]:START.slice();
state.students=Array.isArray(state.students)?state.students.filter(p=>p&&typeof p.name==='string').slice(0,300):[];
state.sessions=Array.isArray(state.sessions)?state.sessions.filter(x=>x&&x.studentId).slice(-1000):[];
state.mistakeFlags=Array.isArray(state.mistakeFlags)?state.mistakeFlags.filter(f=>f&&typeof f.studentId==='string'&&MISTAKE_BY_ID[f.mistakeId]&&['observed','practising','improved'].includes(f.status)).slice(-3000):[];
state.activeStudent=state.students.some(p=>p.id===state.activeStudent)?state.activeStudent:'';
state.saved=Array.isArray(state.saved)?state.saved.filter(x=>x&&Array.isArray(x.selected)&&typeof x.name==='string').slice(0,50):[];
state.duration=[30,45,60,75,90].includes(Number(state.duration))?Number(state.duration):60;
state.age=['5-7','8-10','11-13'].includes(state.age)?state.age:'8-10';
state.level=['new','starter','growing'].includes(state.level)?state.level:'new';
state.group=[2,4,6,8,10,12].includes(Number(state.group))?Number(state.group):6;
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(!storageOkay)return;try{localStorage.setItem(KEY,JSON.stringify({age:state.age,level:state.level,duration:state.duration,group:state.group,selected:state.selected,saved:state.saved,template:state.template,students:state.students,activeStudent:state.activeStudent,sessions:state.sessions,mistakeFlags:state.mistakeFlags}))}catch(e){storageOkay=false;updateStorage();toast('Device storage blocked: export a backup from Saved.')}}
function updateStorage(){const el=$('#storageStatus');if(el)el.innerHTML=storageOkay?'<span class="dot"></span> SAVED ON DEVICE':'<span class="dot" style="background:#ce9850"></span> EXPORT FOR BACKUP'}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2700)}
const ICONS={build:'<path d="M3 5h18M3 12h18M3 19h18"/><path d="M8 3v4M16 10v4M10 17v4"/>',library:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',coach:'<path d="M8 5V3h8v2M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',students:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M17 7a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>',mistakes:'<path d="M4 5h16M4 11h11M4 17h9"/><path d="m16 16 2 2 4-5"/>',saved:'<path d="M5 4h14v17l-7-4-7 4z"/>'};
const svgIcon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
function nav(){const labels={build:'Build lesson',library:'Drill library',coach:'Teach now',students:'Students',mistakes:'Fix mistakes',saved:'Saved plans'};$('#nav').innerHTML=Object.keys(labels).map(k=>`<button data-act="view" data-view="${k}" class="${state.view===k?'active':''}" aria-current="${state.view===k?'page':'false'}">${svgIcon(k)}<span>${labels[k]}</span></button>`).join('')}
function listSelected(){return ORDER.flatMap(s=>D.filter(d=>d.stage===s&&state.selected.includes(d.id)))}
function allocations(){const arr=listSelected();if(!arr.length)return[];const groups=ORDER.filter(s=>arr.some(d=>d.stage===s));const allWeight=groups.reduce((s,k)=>s+STAGES[k].weight,0);const raw=arr.map(d=>{const stageItems=arr.filter(z=>z.stage===d.stage);const groupWeight=STAGES[d.stage].weight/allWeight*state.duration;const totalMin=stageItems.reduce((s,z)=>s+z.mins,0);return groupWeight*d.mins/totalMin});let mins=raw.map(n=>Math.floor(n));let leftover=state.duration-mins.reduce((a,b)=>a+b,0);let indexed=raw.map((n,i)=>({i,f:n-Math.floor(n)})).sort((a,b)=>b.f-a.f);for(let k=0;k<leftover;k++)mins[indexed[k%indexed.length].i]++;return arr.map((d,i)=>({...d,allotted:mins[i]}))}
function dateName(){return 'Class · '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function ballAdvice(){return state.age==='5-7'?'Try red foam/low-compression balls and a small court.':state.age==='8-10'?(state.level==='growing'?'Try orange balls and a scaled court.':'Start with red or orange low-compression balls on a small court.'):'Use orange or green balls depending on ability; start smaller/slower if needed.'}
function timeFormat(s){s=Math.max(0,Math.floor(s||0));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function hero(){return `<section class="hero"><div class="hero-text"><div class="eyebrow">THE LITTLE COACHING PLAYBOOK</div><h1>Pick. Play.<br><span>Coach with joy.</span></h1><p>Build your own kids’ tennis lesson. Every activity has an animated demo and exactly what to say.</p></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 270 220"><rect x="-20" y="18" width="248" height="195" rx="24" fill="#204248" stroke="#56736f" stroke-width="2" transform="rotate(-13 130 100)"/><g transform="rotate(-13 124 108)" stroke="#73918d" fill="none" stroke-width="2"><rect x="37" y="43" width="160" height="142" rx="4"/><path d="M117 43v142M37 114h160M65 43v142M170 43v142"/></g><circle cx="173" cy="72" r="25" fill="#d7f75b"/><path d="M156 49q35 20 32 46M154 90q35-20 39-36" stroke="#7d9f3b" fill="none" stroke-width="2"/><g transform="translate(84 140) rotate(-15)"><ellipse cx="0" cy="-11" rx="31" ry="42" stroke="#fb996e" stroke-width="8" fill="none"/><path d="M0 32v35M-17 8l34-36M-27-2l47-50" stroke="#fb996e" stroke-width="7" stroke-linecap="round"/><path d="M-23-32h46M-25-20h50M-25-8h50" stroke="#fb996e" stroke-width="1.5"/></g></svg></div></section>`}
function profile(){return `<div class="profile"><div class="field"><label for="age">PLAYERS’ AGE</label><select id="age" data-setting="age"><option value="5-7" ${state.age==='5-7'?'selected':''}>5–7 years</option><option value="8-10" ${state.age==='8-10'?'selected':''}>8–10 years</option><option value="11-13" ${state.age==='11-13'?'selected':''}>11–13 years</option></select></div><div class="field"><label for="level">EXPERIENCE</label><select id="level" data-setting="level"><option value="new" ${state.level==='new'?'selected':''}>First-timers</option><option value="starter" ${state.level==='starter'?'selected':''}>Beginners</option><option value="growing" ${state.level==='growing'?'selected':''}>Improving</option></select></div><div class="field"><label for="duration">CLASS LENGTH</label><select id="duration" data-setting="duration">${[30,45,60,75,90].map(n=>`<option value="${n}" ${state.duration===n?'selected':''}>${n} minutes</option>`).join('')}</select></div><div class="field"><label for="group">KIDS IN CLASS</label><select id="group" data-setting="group">${[2,4,6,8,10,12].map(n=>`<option value="${n}" ${state.group===n?'selected':''}>${n} kids</option>`).join('')}</select></div></div><div class="coach-tip"><span class="tip-icon">💡</span><div><strong>Starter tip:</strong> ${ballAdvice()} Age is only a guide — match ball speed and court size to what children can successfully rally with.</div></div>`}
function preview(d){return `<div class="card-visual"><div class="mini-svg" data-preview="${d.id}">${scene(d.id,0.24)}</div><span class="card-topbadge">${STAGES[d.stage].icon} ${STAGES[d.stage].name}</span></div>`}
function card(d){const chosen=state.selected.includes(d.id);return `<article class="drill-card ${chosen?'chosen':''}">${preview(d)}<div class="card-body"><h3>${safe(d.title)}</h3><p class="card-sub">${safe(d.sub)}</p><div class="card-meta"><span class="tag">⏱ ${d.mins}m guide</span><span class="tag">${safe(d.gear)}</span></div><div class="card-actions"><button class="btn secondary" data-act="demo" data-id="${d.id}" aria-label="Watch animated demo for ${safe(d.title)}">▶ Watch demo</button><button class="btn plus ${chosen?'selected':''}" data-act="choose" data-id="${d.id}" aria-pressed="${chosen}">${chosen?'✓ Added':'+ Add'}</button></div></div></article>`}
function stageTabs(){return `<div class="course-tabs" role="tablist" aria-label="Lesson sections">${ORDER.map(s=>`<button role="tab" aria-selected="${state.stage===s}" class="course-tab ${state.stage===s?'active':''}" data-act="stage" data-stage="${s}">${STAGES[s].icon} ${STAGES[s].name}<span class="count">${state.selected.filter(id=>BYID[id]?.stage===s).length}</span></button>`).join('')}</div>`}
function timeline(){let rows=allocations(),start=0;return rows.length?`<div class="timeline">${rows.map((d,i)=>{let at=start;start+=d.allotted;return `<div class="timeline-row"><span class="bubble">${STAGES[d.stage].icon}</span><div class="time-block">${at}–${start}′</div><div class="detail"><b>${safe(d.title)}</b><span>${STAGES[d.stage].name} · ${d.allotted} min</span></div><div class="row-actions"><button class="iconbtn" title="Watch demonstration" aria-label="Watch ${safe(d.title)}" data-act="demo" data-id="${d.id}">▶</button><button class="iconbtn" title="Remove from plan" aria-label="Remove ${safe(d.title)}" data-act="choose" data-id="${d.id}">×</button></div></div>`}).join('')}</div>`:`<div class="empty"><strong>No drills chosen yet</strong>Tap + Add on an activity above.</div>`}
function builder(){const n=state.selected.length,s=STAGES[state.stage];return `${hero()}${templatePicker()}<section class="section"><div class="section-head"><div><div class="eyebrow">STEP 01</div><h2>Your class setup</h2><p>Change these at any time.</p></div><span class="pill">⏱ ${state.duration}-min class</span></div>${profile()}</section><section class="section"><div class="section-head"><div><div class="eyebrow">STEP 02 · YOUR COURSE MENU</div><h2>Pick your activities</h2><p>Try 2 warm-ups, 2 footwork, 2 skills, 1 game and 1 cooldown.</p></div><button class="smallbtn" data-act="shuffle">↻ Mix for me</button></div>${stageTabs()}<div class="stage-note"><span><strong>${s.name}</strong> · ${s.hint}</span><span>Selected ${state.selected.filter(x=>BYID[x].stage===state.stage).length} / suggested ${s.target}</span></div><div class="drill-grid">${D.filter(d=>d.stage===state.stage).map(card).join('')}</div><div class="builder-actions" style="margin-top:15px"><button class="btn outline" data-act="stagePrev" ${state.stage==='warm'?'disabled':''}>← Previous category</button><button class="btn dark" data-act="stageNext" ${state.stage==='cool'?'disabled':''}>Next category →</button></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">STEP 03</div><h2>Your class at a glance</h2><p>${n} chosen activities. Times automatically fit ${state.duration} minutes.</p></div></div>${timeline()}<div class="builder-footer"><div><h3>Ready to coach?</h3><div class="muted">Tap “Teach now” to see one activity at a time.</div></div><div class="next-row"><button class="btn outline" data-act="save" ${n===0?'disabled':''}>♡ Save plan</button><button class="btn dark" data-act="start" ${n===0?'disabled':''}>▶ Teach now</button></div></div></section>`}
function library(){let q=state.search.trim().toLowerCase();const items=D.filter(d=>(state.filter==='all'||d.stage===state.filter)&&(!q||[d.title,d.sub,d.goal,d.term,d.gear].some(x=>x.toLowerCase().includes(q))));return `<section><div class="eyebrow">BROWSE & LEARN</div><h1>Drill library<span style="color:#80b090">.</span></h1><p class="muted">${D.length} different activities. Open any card to watch its own animated movement, practise the words, and check for common mistakes.</p><input class="searchbar" id="search" placeholder="Search ‘forehand’, ‘balance’, ‘catch’…" value="${safe(state.search)}" aria-label="Search activities"><div class="course-tabs"><button class="course-tab ${state.filter==='all'?'active':''}" data-act="filter" data-stage="all">All ${D.length}</button>${ORDER.map(s=>`<button class="course-tab ${state.filter===s?'active':''}" data-act="filter" data-stage="${s}">${STAGES[s].icon} ${STAGES[s].name}</button>`).join('')}</div><div class="section-head" style="margin-top:13px"><div><h2>${items.length} activity${items.length===1?'':'ies'}</h2><p>Tap Watch demo to learn how to coach it.</p></div></div>${items.length?`<div class="drill-grid">${items.map(card).join('')}</div>`:'<div class="empty">No drills match that search. Try another word.</div>'}</section>`}
function coach(){const a=allocations();if(!a.length)return `<div class="empty"><strong>Make your lesson first</strong>Choose activities from the course menu.<p><button class="btn" data-act="view" data-view="build">Build lesson</button></p></div>`;if(state.finished)return `<div class="coach-end"><div class="big">🏆</div><h1>Great coaching!</h1><p>Your ${state.duration}-minute lesson is complete. Ask the children what they enjoyed most.</p><button class="btn dark" data-act="coachRestart">↻ Run this plan again</button> <button class="btn secondary" data-act="view" data-view="students">📋 Record student progress</button> <button class="btn secondary" data-act="view" data-view="build">Edit the menu</button></div>`;state.coachIdx=Math.min(Math.max(state.coachIdx,0),a.length-1);const d=a[state.coachIdx];if(state.seconds===null)state.seconds=d.allotted*60;return `<section><div class="section-head"><div><div class="eyebrow">ON-COURT MODE</div><h2>One drill at a time</h2><p>Read the yellow line aloud; follow the steps.</p></div><span class="pill">${state.coachIdx+1} of ${a.length}</span></div><div class="coach-layout"><div class="coach-main"><div class="coach-header"><div><div class="eyebrow">${STAGES[d.stage].icon} ${STAGES[d.stage].name} · ${d.allotted} MIN</div><h2 style="margin:4px 0 2px">${safe(d.title)}</h2><small>${safe(d.goal)}</small></div><button class="smallbtn" data-act="demo" data-id="${d.id}">⛶ Full demo</button></div><div class="progress"><div style="width:${100*state.coachIdx/a.length}%"></div></div><div class="coach-visual" id="coachVisual" data-demo="${d.id}">${scene(d.id,state.phase)}<div class="viewlabel">${sideScene(d.id)?'SIDE VIEW':'TOP VIEW'} · LOOPING DEMO</div></div><div class="demo-toolbar"><button class="toolbtn" data-act="animToggle">${state.playing?'⏸ Pause demo':'▶ Play demo'}</button><button class="toolbtn" data-act="speak" data-id="${d.id}">🔊 Hear cue</button><button class="toolbtn ${state.speed===.6?'active':''}" data-act="speed" data-speed="0.6">Slow</button><button class="toolbtn ${state.speed===1?'active':''}" data-act="speed" data-speed="1">Normal</button><button class="toolbtn ${state.speed===1.6?'active':''}" data-act="speed" data-speed="1.6">Fast</button><small>Illustrated motion, not video</small></div><div class="coach-content"><div class="say"><strong>🗣 SAY THIS TO THE KIDS</strong><p>${safe(d.say)}</p></div><div class="eyebrow">BEFORE YOU START</div><p style="font-size:14px">${safe(d.setup)} <strong>Equipment:</strong> ${safe(d.gear)}.</p><h3>Do this, step by step</h3><ol class="steps">${d.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><div class="watch-panel"><b>👀 What to check</b>${safe(d.watch)}</div><div class="fix-panel"><strong>Too difficult?</strong> ${safe(d.fix)}<br><strong>Too easy?</strong> ${safe(d.hard)}</div><div class="gloss" style="margin-top:10px"><strong>Term explained:</strong> ${safe(d.term)}</div></div><div class="coach-controls"><button class="btn outline" data-act="coachPrev" ${state.coachIdx===0?'disabled':''}>← Back</button><button class="btn secondary" data-act="demo" data-id="${d.id}">⛶ Full demo</button><button class="btn dark" data-act="coachNext">${state.coachIdx===a.length-1?'✓ Finish class':'Done · Next →'}</button></div></div><aside class="coach-timer"><div><small style="color:#c4e0d3">ACTIVITY TIMER</small><div class="clock" id="clock">${timeFormat(state.seconds)}</div><p>${d.allotted} min planned</p></div><div class="timer-actions"><button class="btn" data-act="timerToggle" id="timerBtn">${state.running?'⏸ Pause':'▶ Start'}</button><button class="btn secondary" data-act="timerReset">↻</button></div><div class="tiny-list">${a.map((z,i)=>`<button class="${i===state.coachIdx?'active':''}" data-act="coachJump" data-index="${i}"><span>${STAGES[z.stage].icon}</span><span style="text-overflow:ellipsis;overflow:hidden;white-space:nowrap">${safe(z.title)}</span><span>${z.allotted}m</span></button>`).join('')}</div></aside></div><div class="water-alert">💧 Check everyone has water and enough space between swings. Pause whenever needed.</div></section>`}

ep that combination.</div>'}<div class="section" style="margin-top:30px"><h3>Coach’s quick safety check</h3><p class="muted">Clear the hitting area, use suitably sized rackets and slower balls, give everyone room to swing, keep water nearby, and stop any movement that causes pain. Make games encouraging, not elimination-based.</p><p class="top-hint">Coaching ideas are original simplified drills informed by youth tennis principles. This app does not replace safeguarding or first-aid training.</p></div></section>`}

nput class="date-input" id="sessionDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"><label class="field-caption" for="lessonNote">What went well / next time</label><textarea class="notes" id="lessonNote" rows="3" placeholder="e.g. 3 forehands reached the big target; next time work on turning sooner."></textarea><button class="btn dark record-button" data-act="studentRecord">✓ Save progress for this lesson</button>${hist.length?`<div class="section" style="margin-top:25px"><h2>Progress over time</h2><p class="muted">Select a skill to see observations by lesson.</p><select id="chartSkill" class="date-input" aria-label="Progress chart skill">${RUBRIC.map(([key,label])=>`<option value="${key}" ${state.chartSkill===key?'selected':''}>${safe(label)}</option>`).join('')}</select>${progressChart(hist,state.chartSkill)}<h3>Lesson history</h3><div class="history-list">${hist.slice().reverse().map(h=>`<div class="history-entry"><div><strong>${safe(h.date)}</strong><small>${safe(h.template||'Custom lesson')} · ${Object.keys(h.scores||{}).length} scored</small>${h.note?`<p>${safe(h.note)}</p>`:''}</div><button class="smallbtn" data-act="sessionDelete" data-id="${safe(h.id)}">Delete</button></div>`).join('')}</div></div>`:''}`:`<div class="empty"><strong>${state.students.length?'Select a child to review progress':'No student profiles yet'}</strong>Add a child to save dated observations of their tennis development.</div>`}</div></section>`}

function mistakesPage(){const categories=['All',...new Set(MISTAKES.map(m=>m.category))];let visible=MISTAKES.filter(m=>(state.mistakeCategory==='All'||m.category===state.mistakeCategory)&&(!state.mistakeFocus||m.drill===state.mistakeFocus||m.category===state.mistakeFocus)&&[m.title,m.spot,m.cue,m.fix,m.category].join(' ').toLowerCase().includes(state.mistakeSearch.toLowerCase()));const focus=state.mistakeFocus?'<button class="smallbtn" data-act="clearMistakeFocus">Clear drill filter ×</button>':'';const picked=student();return `<section><div class="eyebrow">COACH TROUBLESHOOTING</div><h1>Spot it. Fix it.<span style="color:#80b090"> ✓</span></h1><p class="muted">${MISTAKES.length} practical examples covering movement, strokes, games and safety. Correct just one thing at a time, demonstrate, and praise small improvements. These are coaching ideas, not a diagnosis.</p><div class="mistake-tools"><input id="mistakeSearch" aria-label="Search mistakes" placeholder="Search: hitting late, grip, toss..." value="${safe(state.mistakeSearch)}"><select id="mistakeCategory" aria-label="Filter mistake category">${categories.map(c=>`<option value="${safe(c)}" ${state.mistakeCategory===c?'selected':''}>${safe(c)}</option>`).join('')}</select>${focus}</div><div style="margin-bottom:14px" class="muted-mini">${visible.length} matching corrections · ${picked?`Tracking for ${safe(picked.name)}`:'Choose a student in Students to track corrections'}</div>${state.mistakeDetail&&MISTAKE_BY_ID[state.mistakeDetail]?mistakeDetail(MISTAKE_BY_ID[state.mistakeDetail]):`<div class="mistake-list">${visible.map(m=>{let flag=mistakeStudentStatus(m.id);return `<article class="mistake-card"><span class="mistake-pill">${safe(m.category)}${flag?' · '+safe(flag.status):''}</span><h3>${safe(m.title)}</h3><p><b>Spot:</b> ${safe(m.spot)}</p><button class="btn outline" data-act="mistakeOpen" data-id="${m.id}">How to fix →</button></article>`}).join('')||'<div class="empty">No matches. Clear the search or category filter.</div>'}</div>`}</section>`}

eep children spaced safely and supervise each attempt.</p></div><div class="modal-bottom"><button class="btn outline" data-act="close">Close</button><button class="btn ${chosen?'selected':'dark'}" data-act="modalChoose" data-id="${d.id}">${chosen?'✓ Added · Remove':'＋ Add to my class'}</button></div>`;const dialog=$('#drillDialog');if(!dialog.open)dialog.showModal()}

const ease=t=>t*t*(3-2*t),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;

function pointPath(points,t){t=((t%1)+1)%1;const ar=[...points,points[0]],seg=t*(ar.length-1),i=Math.min(Math.floor(seg),ar.length-2),u=ease(seg-i);return [mix(ar[i][0],ar[i+1][0],u),mix(ar[i][1],ar[i+1][1],u)]}

case 'clearMistakeFocus':state.mistakeFocus='';render();break;

case 'mistakesFromDrill':closeDemo();state.mistakeFocus=id;state.mistakeDetail='';changeView('mistakes');break;
case 'mistakeDemo':openDemo(id);break;
case 'mistakeAddDrill':if(!state.selected.includes(id))toggle(id);else toast('Drill already in lesson');break;
case 'mistakeStatus':setMistakeStatus(id,b.dataset.status);break;
case 'template':applyTemplate(id);break;
case 'studentAdd':addStudent();break;
case 'studentRecord':recordStudent();break;
case 'studentDelete':{const p=student();if(p&&confirm('Delete '+p.name+' and all recorded progress?')){state.students=state.students.filter(x=>x.id!==p.id);state.sessions=state.sessions.filter(x=>x.studentId!==p.id);state.mistakeFlags=state.mistakeFlags.filter(x=>x.studentId!==p.id);state.activeStudent='';persist();render()}break;}
case 'sessionDelete':{const h=state.sessions.find(x=>x.id===id);if(h&&confirm('Delete this lesson assessment?')){state.sessions=state.sessions.filter(x=>x.id!==id);persist();render()}break;}
case 'stage':state.stage=b.dataset.stage;render();break;
case 'stageNext':state.stage=ORDER[Math.min(4,ORDER.indexOf(state.stage)+1)];render();break;
case 'stagePrev':state.stage=ORDER[Math.max(0,ORDER.indexOf(state.stage)-1)];render();break;
case 'filter':state.filter=b.dataset.stage;render();break;
case 'choose':toggle(id);break;
case 'modalChoose':closeDemo();toggle(id);break;
case 'demo':openDemo(id);break;
case 'close':closeDemo();break;
case 'shuffle':shuffle();break;
case 'save':save();break;
case 'start':newCoach();break;
case 'coachPrev':jump(state.coachIdx-1);break;
case 'coachNext':next();break;
case 'coachJump':jump(+b.dataset.index);break;
case 'coachRestart':newCoach();break;
case 'timerToggle':state.running=!state.running;state.deadline=state.running?Date.now()+state.seconds*1000:null;const el=$('#timerBtn');if(el)el.textContent=state.running?'⏸ Pause':'▶ Start';break;
case 'timerReset':state.running=false;state.deadline=null;state.seconds=allocations()[state.coachIdx]?.allotted*60||0;if($('#clock'))$('#clock').textContent=timeFormat(state.seconds);if($('#timerBtn'))$('#timerBtn').textContent='▶ Start';break;
case 'animToggle':state.playing=!state.playing;document.querySelectorAll('[data-act="animToggle"]').forEach(el=>el.textContent=state.playing?'⏸ Pause demo':'▶ Play demo');break;
case 'speed':state.speed=+b.dataset.speed;document.querySelectorAll('[data-act="speed"]').forEach(el=>el.classList.toggle('active',+el.dataset.speed===state.speed));break;
case 'speak':{const d=BYID[id];if(!d||!('speechSynthesis' in window)){toast('Voice reading is not available in this browser');break;}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.say.replace(/[“”]/g,''));u.lang='en-US';u.rate=.86;window.speechSynthesis.speak(u);}catch(e){toast('Voice could not start on this device')}break;}
case 'load':load(+b.dataset.index);break;
case 'rename':{const i=+b.dataset.index;const p=state.saved[i];if(!p)break;const name=prompt('Name this lesson:',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,100);persist();render();toast('Lesson renamed')}break;}
case 'delete':{const i=+b.dataset.index;const p=state.saved[i];if(p&&confirm(`Delete saved lesson “${p.name}”?`)){state.saved.splice(i,1);persist();render();toast('Saved lesson deleted')}break}
case 'export':exportData();break;
case 'import':$('#importFile').click();break;
case 'print':window.print();break;
case 'help':toast('1. Set class details  2. Add drills  3. Watch demos  4. Tap Teach now');break;
}});
document.addEventListener('change',e=>{if(e.target.id==='mistakeCategory'){state.mistakeCategory=e.target.value;state.mistakeDetail='';render();return}if(e.target.id==='studentPick'){state.activeStudent=e.target.value;persist();render();return}if(e.target.id==='chartSkill'){state.chartSkill=e.target.value;render();return}const k=e.target.dataset.setting;if(k){state[k]=['duration','group'].includes(k)?Number(e.target.value):e.target.value;state.seconds=null;state.running=false;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='mistakeSearch'){const pos=e.target.selectionStart;state.mistakeSearch=e.target.value;state.mistakeDetail='';render();const el=$('#mistakeSearch');el?.focus();el?.setSelectionRange(pos,pos);return}if(e.target.id==='studentNotes'){const p=student();if(p){p.notes=e.target.value.slice(0,1000);persist()}return}if(e.target.id==='search'){const start=e.target.selectionStart;state.search=e.target.value;const content=$('#screen');const active=document.activeElement;state.view='library';render();const input=$('#search');input.focus();input.setSelectionRange(start,start)}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Backup file is too large');const data=JSON.parse(await file.text());if(data.app!=='Little Rally'||![1,2,3].includes(data.version)||!Array.isArray(data.saved)||!Array.isArray(data.selected))throw Error('Not a Little Rally backup');let clean=data.saved.filter(p=>p&&typeof p.name==='string'&&Array.isArray(p.selected)).slice(0,50).map(p=>({...p,name:p.name.slice(0,100),selected:p.selected.filter(id=>BYID[id]),duration:[30,45,60,75,90].includes(Number(p.duration))?Number(p.duration):60}));state.saved=clean;state.students=Array.isArray(data.students)?data.students.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string').slice(0,300).map(x=>({...x,name:x.name.slice(0,80),notes:String(x.notes||'').slice(0,1000)})):[];state.sessions=Array.isArray(data.sessions)?data.sessions.filter(x=>x&&typeof x.studentId==='string'&&typeof x.date==='string').slice(-1000):[];state.mistakeFlags=Array.isArray(data.mistakeFlags)?data.mistakeFlags.filter(x=>x&&typeof x.studentId==='string'&&MISTAKE_BY_ID[x.mistakeId]&&['observed','practising','improved'].includes(x.status)).slice(-3000):[];state.activeStudent=state.students.some(x=>x.id===data.activeStudent)?data.activeStudent:'';state.selected=data.selected.filter(id=>BYID[id]);state.age=['5-7','8-10','11-13'].includes(data.settings?.age)?data.settings.age:'8-10';state.level=['new','starter','growing'].includes(data.settings?.level)?data.settings.level:'new';state.group=[2,4,6,8,10,12].includes(Number(data.settings?.group))?Number(data.settings.group):6;state.duration=[30,45,60,75,90].includes(Number(data.settings?.duration))?Number(data.settings.duration):60;state.seconds=null;state.coachIdx=0;state.running=false;persist();render();toast(`Imported ${clean.length} saved plan(s)`)}catch(err){toast('Import failed: '+err.message)}finally{e.target.value=''}});
$('#drillDialog').addEventListener('close',()=>{state.modalId=null});
$('#drillDialog').addEventListener('click',e=>{if(e.target===$('#drillDialog'))closeDemo()});
setInterval(()=>{if(!state.running||state.view!=='coach'||state.finished)return;if(state.seconds!==null&&state.seconds>0){state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if($('#clock'))$('#clock').textContent=timeFormat(state.seconds);if(state.seconds===0){state.running=false;state.deadline=null;toast('Time! Tap Done · Next when ready.');const btn=$('#timerBtn');if(btn)btn.textContent='▶ Start'}}},250);
let last=0,lastDraw=0;function animate(now){requestAnimationFrame(animate);if(now-lastDraw<42)return;const delta=last?now-last:42;last=now;lastDraw=now;if(state.playing)state.phase=(state.phase+Math.min(delta,100)*state.speed/4250)%1;let modal=$('#modalVisual'),cv=$('#coachVisual');if(modal&&$('#drillDialog').open&&state.modalId){const caption=modal.querySelector('.viewlabel')?.outerHTML||'';modal.innerHTML=scene(state.modalId,state.phase)+caption}else if(cv&&state.view==='coach'&&!state.finished){const d=allocations()[state.coachIdx];if(d){const caption=cv.querySelector('.viewlabel')?.outerHTML||'';cv.innerHTML=scene(d.id,state.phase)+caption}}}
render();requestAnimationFrame(animate);
</script>
</body></html>
