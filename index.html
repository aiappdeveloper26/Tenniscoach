G("Rally","rally","Hitting the ball back and forth over the net.",["Keep it gentle and over the net.","Count each hit together out loud."],"Keep the ball alive!","The count goes up, so control beats power.","mini tennis rally kids"),
G("Approach shot","approach","A deep ball hit while moving forward to take a net position.",["Hit deep, near the baseline.","Move forward and split-step.","Finish with a volley."],"Hit deep, go in, pop, punch.","The player moves in after the shot instead of staying back.","tennis approach shot juniors"),
G("Scoring","scoring|love","How points are counted.",["0 is ‘love’, then 15, 30, 40, and game.","For beginners: play first to 4 points.","The server says the score before each point."],"Say the score loudly before you serve.","Children can say the score unprompted.","tennis scoring explained kids")];
const glHtml=e=>`<p>${e.w}</p>${e.v?e.v():""}<div class="lab">HOW TO DO IT</div><ol>${e.st.map(x=>`<li>${x}</li>`).join("")}</ol><div class="lab">SAY TO THE KIDS</div><div class="note">“${e.s}”</div><div class="lab">CHECK</div><div class="sub">${e.c}</div><a class="btn" style="text-decoration:none;display:inline-block;margin-top:8px" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}">▶ Watch a demo</a>`;
const termsHtml=c=>{const t=c.t+" "+c.d.join(" ")+" "+c.say,m=GL.filter(e=>e.re.test(t));return m.length?`<div class="lab">📖 NEW WORDS IN THIS STEP</div>${m.map(e=>`<details><summary>${e.n}</summary>${glHtml(e)}</details>`).join("")}`:""};
function drawLearn(){$("s6").innerHTML=`<div class="card"><h3>📖 Coach basics: read this first</h3><p>You don’t need to play tennis. Learn the top 3 items below (about 15 minutes), then follow the Run class screens.</p><div class="lab">THE 4-STEP WAY TO TEACH ANY SKILL</div><ol><li><b>Show</b> it once, slowly (30 seconds).</li><li><b>Say one cue</b>, such as ‘knees bent’.</li><li><b>Kids try</b> without a ball (shadow), then with a ball.</li><li><b>Fix one thing</b>, then praise.</li></ol><div class="note">Can’t demonstrate well? Play a video on your phone (use the ▶ buttons below), or ask an assistant, a parent or a stronger player to demonstrate. Kids copy what they see.</div></div>`+GL.map((e,i)=>`<div class="card"><details ${i<2?"open":""}><summary>${i+1}. ${e.n}</summary>${glHtml(e)}</details></div>`).join("")}

/* Guided class flow */
let run=0,tm=null,left=0;
const stopT=()=>{clearInterval(tm);tm=null};
const fmt=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
function drawRun(){
 stopT();
 const a=AGES[st.age],w=wk()[st.week],D=+st.dur,ms=PH.map(p=>Math.max(2,Math.round(D*p[1]/100))),h2=Math.round(ms[3]/2),di=w.d??st.week;
 const SC=[{k:"start"},{k:"prep"},
 {t:"Welcome and goal",m:ms[0],say:`“Hi team! Today’s goal: ${F(w.goal)}. Let’s have fun and try our best!”`,d:GEN.w,tip:"Keep talking under 2 minutes. Kids switch off fast."},
 {t:"Dynamic warm-up",m:ms[1],say:"“Follow me! Keep moving, big knees, big smiles!”",d:GEN.u,tip:"Make it playful: tag, races, music."},
 {t:"Footwork and coordination",m:ms[2],say:"“Quick feet like a cat! Watch me, then you try.”",d:[w.foot,"Use two lines so nobody waits more than 10 seconds."],tip:"Demonstrate first, then let them move."},
 {t:"Skill A: "+w.b[0][0],m:h2,say:`“Watch me once, then you try. Our target: ${F(w.ok)}.”`,d:w.b[0][1],tip:"Fix one thing at a time.",v:SW[di]?swing(di):""},
 {t:"Skill B: "+w.b[1][0],m:ms[3]-h2,say:"“Great job! Now let’s use it with a partner.”",d:w.b[1][1],tip:"Praise effort and specific actions, e.g. ‘great knee bend’."},
 {t:"Game: "+w.g[0],m:ms[4],say:"“Game time! Here are the rules…”",d:[w.g[1],"Scoring for this age: "+a.score],tip:"Rotate teams quickly so every child gets lots of hits.",v:court(di)},
 {t:"Cool-down",m:ms[5],say:"“Slow it down, deep breath, big stretch.”",d:GEN.c,tip:"Keep it calm and check for any injuries."},
 {t:"Recap and praise",m:ms[6],say:"“What did you learn today? Great effort, everyone!”",d:GEN.r,tip:"Finish with one specific praise for every child."},
 {k:"wrap"}];
 const n=SC.length;if(run>=n)run=0;const c=SC[run];
 let h=`<div class="bar"><i style="width:${Math.round((run+1)/n*100)}%"></i></div><div class="sub">Step ${run+1} of ${n} · ${st.lvl} · ages ${st.age} · Week ${st.week+1}</div>`;
 if(c.k=="start")h+=`<div class="card"><h3>👋 Welcome, coach</h3><p>Follow these screens in order. Each one tells you what to <b>say</b>, what to <b>do</b>, and how long it takes.</p><ol><li><b>Prepare</b> (10 min before): gather gear and set up the court.</li><li><b>Run the class</b>: 8 short steps with a timer.</li><li><b>Wrap up</b>: check if the kids reached the goal and pick next week.</li></ol></div><div class="card"><h3>Today’s lesson</h3><p><span class="tag">${st.lvl.toUpperCase()}</span><span class="tag">AGES ${st.age}</span><span class="tag">${D} MIN</span></p><p><b>Week ${st.week+1}: ${w.f}</b><br>Goal: ${F(w.goal)}</p><div class="note">To change level, age, week or length, use the dropdowns at the top.</div><button class="big sec" onclick="show(1)">📖 New to tennis? Learn the basics first</button></div>`;
 else if(c.k=="prep")h+=`<div class="card step"><h3>🎒 Step 1: Prepare</h3><div class="lab">GATHER</div><ol><li>Balls: ${a.ball}</li><li>Rackets: ${a.racket}</li><li>Cones, hoops or targets (${a.target})</li><li>Ball baskets, water, first-aid kit</li></ol><div class="lab">SET UP THE COURT</div><ol><li>Court: ${a.court}</li><li>Set cones and targets like this diagram (used in today’s game):</li></ol>${court(di)}<div class="lab">SAFETY CHECK</div><ol><li>Clear balls and debris</li><li>Shoes tied and water available</li></ol><button class="big sec" onclick="show(2)">Open the full checklist</button></div>`;
 else if(c.k=="wrap")h+=`<div class="card step"><h3>✅ Wrap up</h3><p>Did most kids reach today’s target?<br><b>${F(w.ok)}</b></p><button class="big" id="ry">Yes: move to next week</button><button class="big sec" id="rn">Not yet: repeat this week</button><div class="lab">BEFORE YOU LEAVE</div><ol><li>Collect all balls and equipment</li><li>Tell parents about any injury</li><li>Write quick notes in the Notes tab</li></ol></div>`;
 else{left=c.m*60;h+=`<div class="card step"><h3>${c.t}</h3><div class="tm" id="tm">${fmt(left)}</div><div class="nav2" style="grid-template-columns:1fr 1fr"><button class="big sec" id="tt">▶ Start timer</button><button class="big sec" id="t1">+1 min</button></div><div class="lab">SAY</div><div class="note">${F(c.say)}</div><div class="lab">DO</div><ol>${c.d.map(x=>`<li>${F(x)}</li>`).join("")}</ol>${c.v||""}<div class="lab">COACH TIP</div><div class="sub">💡 ${c.tip}</div>${termsHtml(c)}</div>`}
 h+=`<div class="nav2">${run?`<button class="big sec" id="bk">← Back</button>`:"<span></span>"}${run<n-1?`<button class="big" id="nx">Next →</button>`:`<button class="big" id="fn">Finish</button>`}</div>`;
 $("s5").innerHTML=h;
 const g=id=>$(id),go=d=>{run=Math.max(0,Math.min(n-1,run+d));drawRun();window.scrollTo(0,0)};
 if(g("nx"))g("nx").onclick=()=>go(1);if(g("bk"))g("bk").onclick=()=>go(-1);if(g("fn"))g("fn").onclick=()=>{run=0;drawRun()};
 if(g("ry"))g("ry").onclick=()=>{st.week=Math.min(7,st.week+1);store.set("cfg",st);ctl();drawLesson();drawOver();run=0;drawRun();window.scrollTo(0,0)};
 if(g("rn"))g("rn").onclick=()=>{run=0;drawRun()};
 if(g("tt")){g("tt").onclick=()=>{if(tm){stopT();g("tt").textContent="▶ Resume"}else{g("tt").textContent="⏸ Pause";tm=setInterval(()=>{left--;g("tm").textContent=left>0?fmt(left):"Time’s up!";if(left<=0){stopT();g("tt").textContent="▶ Start timer";try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}},1000)}};g("t1").onclick=()=>{left+=60;g("tm").textContent=fmt(left)}}
}

/* Drills */
function drawDrills(){
 $("s3").innerHTML=`<input id="q" placeholder="Search drills…" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit"><div id="dl"></div>`;
 const r=()=>{const q=$("q").value.toLowerCase();let h="";DRILLS.forEach(g=>{const it=g[1].filter(x=>!q||x.toLowerCase().includes(q));if(it.length)h+=`<div class="card"><details ${q?"open":""}><summary>${g[0]} (${it.length})</summary><ul>${it.map(x=>`<li>${x}</li>`).join("")}</ul></details></div>`});$("dl").innerHTML=h||"<p>No drills found.</p>"};
 $("q").oninput=r;r();
}

/* Notes + progress */
function drawNotes(){
 let kids=store.get("kids",[]),notes=store.get("notes","");
 let h=`<div class="card"><h3>📝 Session notes</h3><textarea id="nt" rows="5" placeholder="What worked, what to adjust, injuries, reminders…">${notes.replace(/</g,"&lt;")}</textarea></div>
 <div class="card"><h3>👧 Student progress (1–5)</h3><div style="display:flex;gap:6px"><input id="kn" placeholder="Student name" style="flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit"><button class="btn" id="ka">Add</button></div><div id="kl"></div></div><div class="card"><h3>📊 Class average by skill</h3><div id="av"></div></div>`;
 $("s4").innerHTML=h;
 $("nt").oninput=e=>store.set("notes",e.target.value);
 const list=()=>{setTimeout(updAv,0);$("kl").innerHTML=kids.map((k,i)=>`<details><summary>${k.n.replace(/</g,"&lt;")}</summary>${SKILLS.map((s,j)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0"><span>${s}</span><select data-i="${i}" data-j="${j}" style="width:80px">${[0,1,2,3,4,5].map(v=>`<option ${k.s[j]==v?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")}<button class="btn" data-del="${i}">Remove student</button></details>`).join("")||"<p class='sub'>No students yet.</p>";
  $("kl").querySelectorAll("select").forEach(s=>s.onchange=()=>{kids[s.dataset.i].s[s.dataset.j]=+s.value;store.set("kids",kids);updAv()});
  $("kl").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{kids.splice(b.dataset.del,1);store.set("kids",kids);list()})};
 $("ka").onclick=()=>{const n=$("kn").value.trim();if(!n)return;kids.push({n,s:SKILLS.map(()=>0)});store.set("kids",kids);$("kn").value="";list()};
 list();
}

ctl();drawCheck();drawLesson();drawRun();drawLearn();drawOver();drawDrills();drawNotes();show(0);
</script></body></html>
