 else{left=c.m*60;h+=`<div class="card step"><h3>${c.t}</h3><div class="tm" id="tm">${fmt(left)}</div><div class="nav2" style="grid-template-columns:1fr 1fr"><button class="big sec" id="tt">▶ Start timer</button><button class="big sec" id="t1">+1 min</button></div><div class="note">💬 ${F(c.say)}</div><div class="lab">DO</div><ol>${c.d.map(x=>`<li>${F(x)}</li>`).join("")}</ol>${c.v||""}${mvHtml(c)}${/Skill/.test(c.t)?`<button class="big sec" onclick="stuGo(0)">📊 Tally results for this skill</button>`:""}<details><summary>💡 Tip and new words</summary><div class="sub">${c.tip}</div>${termsHtml(c)}</details></div>`}
 h+=`<div class="nav2">${run?`<button class="big sec" id="bk">← Back</button>`:"<span></span>"}${run<n-1?`<button class="big" id="nx">Next →</button>`:`<button class="big" id="fn">Finish</button>`}</div>`;
 $("s5").innerHTML=h;
 const g=id=>$(id),go=d=>{run=Math.max(0,Math.min(n-1,run+d));drawRun();window.scrollTo(0,0)};
 if(g("nx"))g("nx").onclick=()=>go(1);if(g("bk"))g("bk").onclick=()=>go(-1);if(g("fn"))g("fn").onclick=()=>{run=0;drawRun()};
 if(g("ry"))g("ry").onclick=()=>{st.week=Math.min(7,st.week+1);store.set("cfg",st);ctl();drawLesson();drawOver();run=0;drawRun();window.scrollTo(0,0)};
 if(g("rn"))g("rn").onclick=()=>{run=0;drawRun()};
 if(g("tt")){g("tt").onclick=()=>{if(tm){stopT();g("tt").textContent="▶ Resume"}else{g("tt").textContent="⏸ Pause";tm=setInterval(()=>{left--;g("tm").textContent=left>0?fmt(left):"Time’s up!";if(left<=0){stopT();g("tt").textContent="▶ Start timer";try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}},1000)}};g("t1").onclick=()=>{left+=60;g("tm").textContent=fmt(left)}}
}

/* Drills */
function drawDrills(){
 $("s3").innerHTML=`<input id="q" placeholder="Search drills…" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit"><div id="dl"></div>`;
 const r=()=>{const q=$("q").value.toLowerCase();let h="";DRILLS.forEach(g=>{const it=g[1].filter(x=>!q||x.toLowerCase().includes(q));if(it.length)h+=`<div class="card"><details ${q?"open":""}><summary>${g[0]} (${it.length})</summary><ul>${it.map(x=>`<li>${x}</li>`).join("")}</ul></details></div>`});$("dl").innerHTML=h||"<p>No drills found.</p>"};
 $("q").oninput=r;r();
}

/* Notes + progress */
function drawNotes(){
 let kids=store.get("kids",[]),notes=store.get("notes",""),op=-1;
 kids.forEach(k=>{if(!k.log)k.log=[]});
 const save=()=>store.set("kids",kids),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),today=()=>new Date().toISOString().slice(0,10),avg=x=>{const a=x.filter(v=>v>0);return a.length?a.reduce((t,v)=>t+v,0)/a.length:0};
 const spark=lg=>{if(lg.length<2)return `<p class="sub">Save 2 or more log entries to see a progress chart.</p>`;const W=280,H=90,p=14,pt=lg.map((e,i)=>[p+i*(W-2*p)/(lg.length-1),H-p-avg(e.s)/5*(H-2*p)]);return `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--bd)"/><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pt.map(q=>q.join(",")).join(" ")}"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--ac)"/><text x="${q[0]}" y="${q[1]-7}" font-size="9" text-anchor="middle" fill="var(--tx)">${avg(lg[i].s).toFixed(1)}</text>`).join("")}</svg><div class="sub">Average skill rating (1–5) at each log entry</div>`};
 $("s4").innerHTML=`<div class="card"><h3>📝 Class notes</h3><textarea id="nt" rows="4" placeholder="What worked, what to change, reminders…">${esc(notes)}</textarea></div><div class="card"><h3>👧 Student progress log</h3><p class="sub">1) Add each student. 2) After class, rate their skills and tap ‘Save log entry’. 3) Watch their progress chart grow.</p><div style="display:flex;gap:6px"><input id="kn" placeholder="Student name"><button class="btn" id="ka">Add</button></div><div id="kl"></div></div><div class="card"><h3>📊 Class average by skill</h3><div id="av"></div></div>`;
 $("nt").oninput=e=>store.set("notes",e.target.value);
 const list=()=>{
  $("kl").innerHTML=kids.map((k,i)=>{const L=k.log,pr=L.filter(e=>e.att!="Absent").length,la=L.length?avg(L[L.length-1].s):0;
   return `<details data-i="${i}" ${op==i?"open":""}><summary>${esc(k.n)} <span class="tag">${L.length} logs</span>${la?`<span class="tag">latest ${la.toFixed(1)}</span>`:""}</summary><div class="lab">PROGRESS CHART</div>${spark(L)}<div class="lab">SKILL RATINGS NOW (0 = not rated)</div>${SKILLS.map((x,j)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0"><span>${x}</span><select class="sk" data-i="${i}" data-j="${j}" style="width:80px">${[0,1,2,3,4,5].map(v=>`<option ${k.s[j]==v?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")}<div class="lab">LOG THIS SESSION</div><div class="lg2"><input type="date" class="ld" value="${today()}"><select class="la"><option>Present</option><option>Absent</option></select></div><input class="ln" placeholder="Note: what went well, what to work on"><button class="big" data-add="${i}">Save log entry</button><div class="lab">HISTORY (attended ${pr} of ${L.length})</div>${L.length?L.map((e,j)=>`<div class="lgrow"><b>${e.d}</b> ${e.att=="Absent"?"❌ absent":"✅ present"} · ${esc(e.lv)}, week ${e.wk} · avg ${avg(e.s).toFixed(1)}<br>${esc(e.note||"")}<br><button class="btn" data-dl="${i}-${j}">Delete entry</button></div>`).reverse().join(""):"<p class='sub'>No entries yet.</p>"}<button class="btn" data-del="${i}" style="margin-top:10px">Remove student</button></details>`}).join("")||"<p class='sub'>No students yet. Add your first student above.</p>";
  const q=(a,f)=>$("kl").querySelectorAll(a).forEach(f);
  q("details",d=>d.ontoggle=()=>{if(d.open)op=+d.dataset.i});
  q("select.sk",e=>e.onchange=()=>{kids[e.dataset.i].s[e.dataset.j]=+e.value;save();updAv()});
  q("[data-add]",b=>b.onclick=()=>{const i=+b.dataset.add,d=b.parentElement,k=kids[i];k.log.push({d:d.querySelector(".ld").value||today(),att:d.querySelector(".la").value,wk:st.week+1,lv:st.lvl,s:[...k.s],note:d.querySelector(".ln").value.trim()});k.log.sort((a,b)=>a.d<b.d?-1:1);save();op=i;list()});
  q("[data-dl]",b=>b.onclick=()=>{const [i,j]=b.dataset.dl.split("-").map(Number);kids[i].log.splice(j,1);save();op=i;list()});
  q("[data-del]",b=>b.onclick=()=>{if(confirm("Remove this student and their log?")){kids.splice(b.dataset.del,1);save();op=-1;list()}});
  updAv()};
 $("ka").onclick=()=>{const n=$("kn").value.trim();if(!n)return;kids.push({n,s:SKILLS.map(()=>0),log:[]});save();$("kn").value="";op=kids.length-1;list()};
 list();
}

ctl();drawCheck();drawLesson();drawRun();drawLearn();drawVid();drawMenu();$("sn").innerHTML=["🎯 Tally","📈 Analytics","📝 Log"].map((t,k)=>`<button class="chip" onclick="stuGo(${k})">${t}</button>`).join("");drawOver();drawDrills();drawNotes();show(0);
</script></body></html>
